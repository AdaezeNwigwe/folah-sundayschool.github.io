<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Bloomers Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: classroom screen. One lesson section at a time, huge tap targets, week color drives everything. */
:root {
  --bg: #FBF7F2;
  --paper: #FFFFFF;
  --ink: #2A1F3D;
  --muted: #6B6080;
  --line: #E6DDEA;
  --soft: #F3ECF7;
  --good: #15803D;
  --good-bg: #DCFCE7;
  --bad: #B91C1C;
  --bad-bg: #FEE2E2;
  --sun: #FACC15;
  --w1: #C2410C; --w1-soft: #FFEDD5;
  --w2: #A16207; --w2-soft: #FEF3C7;
  --w3: #1D4ED8; --w3-soft: #DBEAFE;
  --w4: #0F766E; --w4-soft: #CCFBF1;
  --w5: #BE185D; --w5-soft: #FCE7F3;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --accent: var(--w1); --accent-soft: var(--w1-soft);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17121F; --paper: #221B2E; --ink: #F3EEF8; --muted: #B5AAC6; --line: #3A3049; --soft: #2C2340;
  --good: #4ADE80; --good-bg: #14321F; --bad: #F87171; --bad-bg: #3B1717; --sun: #FACC15;
  --w1: #FB923C; --w1-soft: #3A2114; --w2: #FBBF24; --w2-soft: #3A2E10; --w3: #60A5FA; --w3-soft: #16264A; --w4: #2DD4BF; --w4-soft: #10302C; --w5: #F472B6; --w5-soft: #3A1426;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17121F; --paper: #221B2E; --ink: #F3EEF8; --muted: #B5AAC6; --line: #3A3049; --soft: #2C2340;
  --good: #4ADE80; --good-bg: #14321F; --bad: #F87171; --bad-bg: #3B1717; --sun: #FACC15;
  --w1: #FB923C; --w1-soft: #3A2114; --w2: #FBBF24; --w2-soft: #3A2E10; --w3: #60A5FA; --w3-soft: #16264A; --w4: #2DD4BF; --w4-soft: #10302C; --w5: #F472B6; --w5-soft: #3A1426;
  color-scheme: dark; }
body[data-week="1"] { --accent: var(--w1); --accent-soft: var(--w1-soft); }
body[data-week="2"] { --accent: var(--w2); --accent-soft: var(--w2-soft); }
body[data-week="3"] { --accent: var(--w3); --accent-soft: var(--w3-soft); }
body[data-week="4"] { --accent: var(--w4); --accent-soft: var(--w4-soft); }
body[data-week="5"] { --accent: var(--w5); --accent-soft: var(--w5-soft); }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.5; padding-inline: 16px; padding-block: 0 48px; }
.wrap { max-width: 1040px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }

/* top */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 20px 12px; }
.brand { display: flex; align-items: center; gap: 12px; }
.flower { width: 44px; height: 44px; flex: none; }
.brand small { display: block; font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; color: var(--muted); }
.brand b { font-family: var(--display); font-size: 26px; font-weight: 700; }
.picker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.topnav { display: flex; gap: 8px; flex-wrap: wrap; }
.navbtn { padding: 12px 22px; font-size: 18px; text-decoration: none; display: inline-flex; align-items: center; min-height: 48px; }
body.home .picker { display: none; }
.picker label.series { display: none !important; }
.hfind { display: grid; gap: 10px; margin: 0 0 8px; }
#hsearch { font: inherit; font-size: 18px; padding: 12px 16px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--ink); width: 100%; }
.hjump { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.hchip { flex: none; border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-family: var(--display); font-weight: 600; font-size: 15px; min-height: 40px; }
.hchip:hover { border-color: var(--accent); }
.hgroup { margin-top: 14px; scroll-margin-top: 12px; }
.hgroup > summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; padding: 10px 4px; list-style: none; }
.hgroup > summary::-webkit-details-marker { display: none; }
.hgroup > summary::before { content: "▸"; color: var(--muted); font-size: 18px; transition: transform .15s; }
.hgroup[open] > summary::before { transform: rotate(90deg); }
.hgroup > summary .hseries { margin: 0 auto 0 0; }
.hcount { font-size: 14px; color: var(--muted); }
.hgo { font-family: var(--display); font-size: 24px; color: var(--muted); }
.hnone { color: var(--muted); font-size: 18px; margin-top: 18px; }
.hintro { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.series { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--muted); }
.series select { font: inherit; font-size: 17px; color: var(--ink); background: var(--paper); border: 2px solid var(--line); border-radius: 12px; padding: 7px 12px; }
.weeks { display: flex; gap: 8px; flex-wrap: wrap; }
.weekbtn { border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 8px 16px; font-family: var(--display); font-weight: 600; font-size: 16px; display: flex; gap: 8px; align-items: center; }
.weekbtn .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--soft); font-size: 14px; }
.weekbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--paper); }
.weekbtn[aria-pressed="true"] .n { background: var(--paper); color: var(--accent); }

/* hero */
.hero { background: var(--accent-soft); border-radius: 28px; padding: 28px clamp(20px, 4vw, 40px); display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; margin-block: 8px 18px; }
.hero .big { font-size: clamp(56px, 9vw, 96px); line-height: 1; }
.hero .ref { font-family: var(--display); font-weight: 600; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; font-size: 15px; }
.hero h1 { font-size: clamp(30px, 5vw, 50px); line-height: 1.05; margin-block: 4px 10px; }
.hero p { margin: 0; font-size: 19px; }
.hero p strong { font-family: var(--display); }

.printables { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.dl { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--accent); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 8px 14px; font-family: var(--display); font-weight: 600; font-size: 16px; text-decoration: none; cursor: pointer; }
.dl small { font-family: var(--body); font-weight: 700; font-size: 12px; color: var(--accent); letter-spacing: .06em; }
.dl:hover { background: var(--accent-soft); }
.dlmsg { font-size: 14px; color: var(--muted); align-self: center; }
/* section tabs */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; scrollbar-width: thin; }
.tab { flex: none; border: 0; background: transparent; padding: 10px 16px; border-radius: 14px; font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 0 0 2px var(--accent) inset; }
.tab:hover { color: var(--ink); }

.panel { background: var(--paper); border: 2px solid var(--line); border-radius: 28px; padding: clamp(20px, 4vw, 40px); min-height: 440px; }
.panel h2 { font-size: clamp(26px, 4vw, 36px); margin-bottom: 6px; }
.lead { color: var(--muted); margin: 0 0 22px; }

.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 16px; padding: 14px 24px; font-family: var(--display); font-weight: 600; font-size: 19px; background: var(--accent); color: var(--paper); }
.btn.ghost { background: var(--soft); color: var(--ink); }
.btn:disabled { opacity: .35; cursor: default; }
.dots { display: flex; gap: 8px; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); border: 0; padding: 0; }
.dot[aria-current="true"] { background: var(--accent); transform: scale(1.25); }

/* story */
.scene { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 32px; align-items: center; }
.scene .art { aspect-ratio: 1; max-width: 100%; border-radius: 32px; background: var(--accent-soft); display: grid; place-items: center; font-size: clamp(80px, 14vw, 130px); }
.scene .step { font-family: var(--display); font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; font-size: 15px; }
.scene h3 { font-size: clamp(28px, 4vw, 40px); margin-block: 4px 12px; }
.scene p { font-size: clamp(20px, 2.4vw, 25px); line-height: 1.5; margin: 0; max-width: 34ch; }
.scene.recap { align-items: start; }
.scene.recap ul { margin: 0; padding-left: 1.2em; display: grid; gap: 10px; font-size: clamp(18px, 2.1vw, 22px); line-height: 1.45; max-width: 46ch; }
.scene.recap li::marker { color: var(--accent); }
@keyframes pop { from { transform: scale(.92); opacity: .4; } to { transform: none; opacity: 1; } }
.anim { animation: pop .35s ease-out; }

/* verse */
.verse-target { min-height: 120px; border: 3px dashed var(--line); border-radius: 22px; padding: 18px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; margin-bottom: 18px; }
.verse-target.done { border-style: solid; border-color: var(--good); background: var(--good-bg); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { border: 2px solid var(--accent); background: var(--accent-soft); border-radius: 14px; padding: 10px 16px; font-family: var(--display); font-weight: 600; font-size: 22px; }
.chip.placed { background: var(--paper); }
.chip.wrong { animation: shake .3s; border-color: var(--bad); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.verse-full { font-family: var(--display); font-size: clamp(24px, 3.4vw, 34px); line-height: 1.35; font-weight: 500; }
.verse-full .gap { display: inline-block; min-width: 3.2ch; border-bottom: 4px solid var(--accent); color: transparent; margin: 0 .1em; cursor: pointer; }
.verse-full .gap.show { color: var(--accent); }
.mode { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.status { font-family: var(--display); font-weight: 600; font-size: 20px; min-height: 1.5em; margin-top: 14px; }
.status.good { color: var(--good); }

/* quiz */
.qcount { font-family: var(--display); font-weight: 600; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; font-size: 15px; }
.question { font-size: clamp(24px, 3.4vw, 34px); font-family: var(--display); font-weight: 600; line-height: 1.25; margin-block: 8px 22px; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--paper); border-radius: 18px; padding: 16px 18px; font-size: 21px; display: flex; gap: 12px; align-items: center; }
.opt .letter { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); font-family: var(--display); font-weight: 700; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right .letter { background: var(--good); color: var(--paper); }
.opt.wrongpick { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.feedback { font-family: var(--display); font-weight: 600; font-size: 22px; min-height: 1.6em; margin-top: 16px; }
.feedback.good { color: var(--good); } .feedback.bad { color: var(--bad); }
.tfbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tfbtn { border: 3px solid var(--line); border-radius: 22px; padding: 26px 10px; font-family: var(--display); font-weight: 700; font-size: clamp(26px, 4vw, 36px); background: var(--paper); }
.tfbtn.right { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.tfbtn.wrongpick { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.score { text-align: center; padding-block: 30px; }
.score .num { font-family: var(--display); font-size: 84px; font-weight: 700; color: var(--accent); line-height: 1; }
.score p { font-size: 22px; }

/* crossword */
.cw-layout { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; align-items: start; }
.cw-scroll { overflow-x: auto; max-width: 100%; }
.cw { display: grid; gap: 3px; }
.cell { position: relative; width: 44px; height: 44px; }
.cell input { width: 100%; height: 100%; border: 2px solid var(--ink); border-radius: 6px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 22px; text-transform: uppercase; background: var(--paper); color: var(--ink); padding: 0; caret-color: var(--accent); }
.cell input.hl { background: var(--accent-soft); }
.cell input.ok { background: var(--good-bg); border-color: var(--good); }
.cell input.no { background: var(--bad-bg); border-color: var(--bad); }
.cell .num { position: absolute; top: 2px; left: 4px; font-size: 11px; font-weight: 700; color: var(--accent); pointer-events: none; }
.clues h3 { font-size: 20px; color: var(--accent); margin-block: 0 8px; }
.clues ol { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 4px; }
.clue { border: 0; background: transparent; text-align: left; padding: 6px 10px; border-radius: 10px; font-size: 18px; width: 100%; }
.clue b { font-family: var(--display); color: var(--accent); margin-right: 6px; }
.clue.active { background: var(--accent-soft); }
.clue.solved { color: var(--muted); text-decoration: line-through; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

/* word search */
.ws-layout { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; align-items: start; }
.ws { display: grid; gap: 4px; user-select: none; }
.ws button { width: 42px; height: 42px; border: 0; border-radius: 10px; background: var(--soft); font-family: var(--display); font-weight: 700; font-size: 21px; padding: 0; }
.ws button.sel { background: var(--accent); color: var(--paper); }
.ws button.found { background: var(--sun); color: #2A1F3D; }
.wordlist { display: flex; flex-wrap: wrap; gap: 8px; }
.wordlist span { font-family: var(--display); font-weight: 600; font-size: 19px; padding: 6px 14px; border-radius: 999px; background: var(--soft); }
.wordlist span.found { background: var(--sun); color: #2A1F3D; text-decoration: line-through; }

/* talk */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.flip { border: 2px solid var(--line); background: var(--paper); border-radius: 22px; padding: 22px; text-align: left; min-height: 150px; display: flex; flex-direction: column; gap: 8px; }
.flip .lbl { font-family: var(--display); font-weight: 600; color: var(--accent); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.flip .q { font-size: 21px; font-family: var(--display); font-weight: 500; line-height: 1.3; }
.flip.hide .q { filter: blur(9px); }
.flip.star { border-color: var(--sun); }
.sub { font-size: 22px; margin-block: 30px 12px; }
.games { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.game { background: var(--accent-soft); border-radius: 22px; padding: 20px; }
.game h3 { font-size: 21px; margin-bottom: 6px; }
.game p { margin: 0; font-size: 17px; }
.links { display: grid; gap: 8px; padding: 0; list-style: none; margin: 0; }
.links a { color: var(--accent); font-weight: 700; }
.prayer { margin-top: 26px; padding: 22px; border-radius: 22px; background: var(--soft); font-style: italic; font-size: 20px; }
.prayer b { font-style: normal; font-family: var(--display); display: block; margin-bottom: 6px; color: var(--accent); }

@media (max-width: 760px) {
  body { font-size: 16px; }
  .hero { grid-template-columns: 1fr; gap: 8px; }
  .scene { grid-template-columns: 1fr; gap: 16px; }
  .scene .art { max-width: 180px; }
  .opts, .cards, .games { grid-template-columns: 1fr; }
  .cw-layout, .ws-layout { grid-template-columns: minmax(0, 1fr); }
  .cell { width: 30px; height: 30px; } .cell input { font-size: 16px; }
  .ws button { width: 28px; height: 28px; font-size: 15px; border-radius: 6px; }
}
@media (prefers-reduced-motion: reduce) { .anim, .chip.wrong { animation: none; } .dot[aria-current="true"] { transform: none; } }
/* add a lesson */
.addbtn { border: 2px dashed var(--accent); background: var(--paper); color: var(--accent); border-radius: 999px; padding: 8px 16px; font-family: var(--display); font-weight: 600; font-size: 16px; min-height: 44px; }
.addbtn:hover { background: var(--accent-soft); }
.mine { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.tag { font-family: var(--display); font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
.minibtn { border: 2px solid var(--line); background: var(--paper); border-radius: 12px; padding: 6px 12px; font-family: var(--display); font-weight: 600; font-size: 15px; min-height: 40px; }
.minibtn:hover { border-color: var(--accent); }
dialog.add { width: min(860px, calc(100vw - 20px)); max-height: calc(100dvh - 20px); border: 0; border-radius: 24px; padding: 0; background: var(--bg); color: var(--ink); }
dialog.add::backdrop { background: rgba(20, 12, 30, .55); }
.add form { padding: clamp(16px, 3vw, 32px); display: grid; gap: 16px; }
.add .head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.add h2 { font-size: 32px; margin-bottom: 4px; }
.x { border: 0; background: var(--soft); border-radius: 50%; width: 44px; height: 44px; font-size: 20px; flex: none; }
.fs { background: var(--paper); border: 2px solid var(--line); border-radius: 18px; padding: 14px 18px; margin: 0; min-width: 0; }
.fs legend, .fs > summary { font-family: var(--display); font-weight: 600; font-size: 20px; padding: 0 4px; }
fieldset.fs legend { margin-bottom: 4px; }
.fs > summary { cursor: pointer; min-height: 32px; }
.fs > summary small { font-family: var(--body); font-weight: 400; font-size: 14px; color: var(--muted); margin-left: 6px; }
.fs[open] > summary { margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fld { display: grid; gap: 4px; font-size: 15px; font-weight: 700; min-width: 0; }
.fld small { font-weight: 400; color: var(--muted); }
.fld.inline { grid-template-columns: auto 90px; align-items: center; justify-content: start; gap: 10px; }
.add input, .add textarea, .add select { font: inherit; font-size: 16px; font-weight: 400; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; min-height: 44px; min-width: 0; }
.add textarea { min-height: 84px; resize: vertical; }
.rows { display: grid; gap: 10px; }
.row { display: grid; gap: 8px; align-items: start; padding: 10px; border-radius: 12px; background: var(--soft); min-width: 0; }
.row.story { grid-template-columns: 72px minmax(0, 1fr); }
.row.story textarea { grid-column: 1 / -1; min-height: 64px; }
.row.pair { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.row.tf { grid-template-columns: minmax(0, 1fr) 110px; }
.row.mc .opts4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.addrow { justify-self: start; margin-top: 10px; border: 2px dashed var(--line); background: transparent; border-radius: 12px; padding: 8px 14px; font-family: var(--display); font-weight: 600; font-size: 16px; min-height: 44px; }
.addrow:hover { border-color: var(--accent); }
.hint { color: var(--muted); font-size: 15px; margin: 0; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; position: sticky; bottom: calc(-1 * clamp(16px, 3vw, 32px)); background: var(--bg); padding-block: 12px; }
.foot .msg { margin-right: auto; font-size: 15px; font-weight: 700; color: var(--muted); }
.foot .msg.bad { color: var(--bad); }
.empty { color: var(--muted); font-size: 19px; }
/* lesson list home */
body.home #hero, body.home #tabs, body.home #panel, body.home label.series, body.home #weeks, body.home #allBtn { display: none !important; }
#homeView { padding-bottom: 20px; }
.hintro { background: var(--accent-soft); border-radius: 28px; padding: 24px clamp(20px, 4vw, 40px); margin: 8px 0 20px; }
.hintro h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.05; }
.hintro p { margin: 6px 0 0; }
.hseries { margin: 22px 0 10px; font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hlist { display: grid; gap: 12px; }
.hitem { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; align-items: center; background: var(--paper); border: 2px solid var(--line); border-radius: 22px; padding: 14px 18px; cursor: pointer; }
.hitem:hover { border-color: var(--accent); }
.hitem .em { font-size: 44px; text-align: center; }
.hitem .ref { font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--muted); letter-spacing: .04em; }
.hitem h3 { font-size: 22px; }
.hitem p { margin: 2px 0 0; font-size: 17px; }
.hdone { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--muted); background: none; border: 2px solid var(--line); border-radius: 12px; padding: 6px 12px; min-height: 40px; white-space: nowrap; }
.hdone[aria-pressed="true"] { border-color: var(--good); color: var(--good); background: var(--good-bg); }
.hnote { color: var(--muted); font-size: 14px; margin-top: 14px; }
@media (max-width: 600px) { .hitem { grid-template-columns: 48px minmax(0, 1fr); } .hitem .em { font-size: 34px; } .hdone { grid-column: 1 / -1; justify-self: start; } }
.fs[hidden] { display: none !important; }
.fs > summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.fs > summary .sumtxt { margin-right: auto; }
.secdel { border: 0; background: var(--soft); color: var(--muted); border-radius: 10px; padding: 6px 12px; font-family: var(--display); font-weight: 600; font-size: 14px; min-height: 36px; }
.secdel:hover { color: var(--bad); background: var(--bad-bg); }
.row { position: relative; padding-right: 48px; }
.rowdel { position: absolute; top: 10px; right: 8px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--paper); color: var(--muted); font-size: 15px; padding: 0; }
.rowdel:hover { color: var(--bad); background: var(--bad-bg); }
.secbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.secbar .addrow { margin-top: 0; }
.secbar[hidden] { display: none; }
@media (max-width: 600px) { .grid2, .row.pair, .row.mc .opts4 { grid-template-columns: minmax(0, 1fr); } .fs { padding: 12px; } }
.tbox{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:14px}.tbtn{display:inline-flex;align-items:center;min-height:44px;padding:8px 18px;border-radius:999px;background:#15803d;color:#fff;font:600 16px var(--display,inherit);text-decoration:none}button.tbtn{border:0;cursor:pointer;font-family:inherit}.tbtn:disabled{opacity:.7}.tbtn:hover{filter:brightness(1.08)}.tbtn.done{background:#166534}.tnote{font-size:14px;color:var(--muted)}.tbadge{display:inline-block;font:600 13px var(--display,inherit);padding:4px 12px;border-radius:999px;background:#dcfce7;color:#166534;white-space:nowrap}:root[data-theme=dark] .tbadge{background:#14532d;color:#bbf7d0}

function tKey(s,w){return s.id+"-w"+w.id}

function tFmt(d){const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(d||"");return m?["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m[2]-1]+" "+(+m[3]):""}
function tToday(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function tOn(s,w){const t=((window.TAUGHT||{})[TCLS]||{})[tKey(s,w)];return typeof t==="string"?t:""}

document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("button.tbtn");if(!a||a.disabled)return;a.disabled=true;a.textContent="Saving…";const n=a.parentNode.querySelector(".tnote");const body=new URLSearchParams({"entry.2009767917":TCLS,"entry.749423249":a.dataset.tlabel});fetch(TFORM,{method:"POST",mode:"no-cors",body}).then(()=>{const s=tSent();s[a.dataset.tkey]=tToday();try{localStorage.setItem("folah-taught-sent",JSON.stringify(s))}catch(_){}a.textContent="✓ Done";a.classList.add("done");if(n)n.textContent="Saved. All teachers will see this lesson as Done."}).catch(()=>{a.textContent="✓ Mark as done";if(n)n.textContent="Couldn't save. Check the internet connection and try again."}).finally(()=>{a.disabled=false})});
function tParse(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==","){r.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);rows.push(r);r=[];f=""}else f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows}

const SERIES=[{"id": "thanksgiving", "name": "Thanksgiving", "weeks": [{"id": 1, "short": "Thanksgiving", "title": "Give Thanks to the Lord!", "ref": "Exodus 15 to John 6", "emoji": "🌾", "bigIdea": "When we thank God for what we have, even a little, he can do big things with it.", "verse": "Give thanks to the LORD, for he is good; his love endures forever.", "verseRef": "Psalm 107:1", "story": [["🌊", "A song by the sea", "God opened a path through the Red Sea, and his people walked across on dry ground. Safe on the other side, Moses and the people sang a thank-you song to God. Miriam played her tambourine and all the women danced! (Exodus 15)"], ["🌾", "Harvest parties", "God told his people to have big thank-you festivals every year. At harvest time they brought the first and best of their crops to God, camped in leafy shelters, and celebrated for seven days. (Exodus 23, Leviticus 23)"], ["🎺", "David's song of thanks", "When King David brought the ark of God home to Jerusalem, there was music, trumpets and singing. David gave everyone bread, dates and raisins, and sang, \"Give thanks to the LORD, for he is good!\" (1 Chronicles 16)"], ["🙌", "One came back", "Ten men with a skin sickness called out, \"Jesus, have pity on us!\" Jesus healed all ten. But only one came back, shouting praise to God. He bowed at Jesus' feet and said thank you. Jesus asked, \"Where are the other nine?\" (Luke 17)"], ["🧺", "A boy's small lunch", "Thousands of hungry people came to hear Jesus. A boy had five small loaves and two small fish. It looked like nothing for so many! Jesus took the bread and gave thanks to God. (John 6)"], ["✨", "Thanks, then more!", "After Jesus gave thanks, the food kept going and going. About 5,000 men, plus women and children, ate until they were full. Then the disciples filled twelve baskets with leftovers! A little, given with thanks, became a lot. (John 6)"]], "storyNote": "Scene 1: say gently that the sea closed and the army could no longer chase God's people. Older kids may ask what happened to the Egyptians (Exodus 14:28); answer simply that God rescued his people from danger. Scene 4: the men had a sickness called leprosy that made people keep away from them. For the big idea, be careful not to teach that saying thanks is a magic trick for getting more. Thankful hearts trust God, and God loves to bless and use what we give him. Bonus examples for older kids: Jesus gave thanks before feeding 4,000 (Matthew 15:36) and before raising Lazarus (John 11:41).", "discussion": ["Moses and Miriam sang right after God rescued them. What has God done for you that you could sing about?", "Ten men were healed, but only one came back. Why do you think the other nine forgot to say thank you?", "The boy's lunch was small, but Jesus gave thanks for it. What happened next?", "Name three things you can thank God for right now, even small things."], "challenge": ["God made thanksgiving a yearly festival for his people. Why do you think he wanted them to remember to say thanks on purpose?", "Read 1 Thessalonians 5:18. Does it say to give thanks only when things are good? What does that mean for a hard day?", "Jesus gave thanks before the food multiplied, not after. What does that show about trusting God?"], "mc": [["Who played a tambourine after crossing the Red Sea?", ["Sarah", "Miriam", "Ruth", "Esther"], 1], ["What did God's people bring to him at harvest time?", ["Gold coins", "The first and best of their crops", "New clothes", "Toys"], 1], ["What did King David give to the people when the ark came home?", ["Bread, dates and raisins", "Swords", "Sheep", "Nothing"], 0], ["How many healed men came back to thank Jesus?", ["None", "One", "Five", "All ten"], 1], ["What did Jesus do with the boy's loaves before he shared them?", ["Hid them", "Sold them", "Gave thanks to God", "Threw them away"], 2], ["How many baskets of leftovers were there?", ["Two", "Five", "Seven", "Twelve"], 3]], "tf": [["After crossing the Red Sea, the people sang a song to God.", true], ["God told his people to celebrate harvest festivals every year.", true], ["King David was grumpy when the ark came to Jerusalem.", false], ["All ten healed men came back to say thank you.", false], ["The boy had five loaves and two fish.", true], ["Jesus gave thanks before the food was shared.", true]], "games": [["Miriam's Praise Parade", "Kids march around the room with shakers, tambourines or clapping hands. When the leader stops the music, call out one child to shout one thing they thank God for, then the parade starts again."], ["Where Are the Nine?", "Before class, hide nine paper people around the room. Keep the tenth one with you, holding a THANK YOU sign. Kids find all nine and bring them back to \"say thank you\" to Jesus. Ask: why is it easy to forget to say thanks?"], ["Thankful Blob Tag", "One child is \"it.\" When someone is tagged, they say one thing they are thankful for and join hands with the tagger. The blob keeps growing until everyone is in it. Point out how thanks multiplied, just like the bread!"]], "craft": {"name": "Thank You Tambourine", "supplies": ["Two paper plates per child", "Dried beans, rice or small jingle bells (a spoonful each)", "Stapler and tape", "Markers, crayons, stickers, ribbon or crepe paper streamers"], "steps": ["Kids decorate the back of both plates and write GIVE THANKS! on one plate.", "On the other plate, write or draw three things they thank God for.", "Put a spoonful of beans or bells on one plate, place the second plate on top, and staple all the way around close together (leaders help the little ones). Cover with tape so nothing spills.", "Tape ribbons around the edge. Shake your tambourine and say the memory verse together, like Miriam!"]}, "links": [["Jesus Heals 10 Lepers lesson with printable PDF, crafts and coloring pages", "https://ministry-to-children.com/?p=53567"], ["Ten Lepers lesson with puppet crafts and a \"Thank You\" book", "https://daniellesplace.com/html/rr_samplelepers.html"], ["Thanksgiving Bible verse coloring sheets (includes Psalm 107:1)", "https://www.abcjesuslovesme.com/ideas/thanksgiving-bible-verse-printables"], ["Turkey Time crafts for Sunday school (leaf wreath and more)", "https://ministry-to-children.com/thanksgiving-turkey-crafts/"]], "drawPrompt": "Draw something God has given you that you want to thank him for. Draw yourself saying thank you!", "prayer": "Dear God, thank you for being so good to me. Thank you for my family, my food, my friends and for Jesus. Help me remember to say thank you every day, like the one man who came back. Take the little I have and use it for big things. In Jesus' name, Amen.", "crossword": {"rows": 11, "cols": 7, "words": [{"word": "MIRIAM", "clue": "She played a tambourine and danced by the sea", "r": 3, "c": 0, "d": "A", "n": 3}, {"word": "ONE", "clue": "How many came back to say thank you?", "r": 6, "c": 2, "d": "A", "n": 7}, {"word": "SEA", "clue": "God made a path through the Red ___", "r": 7, "c": 0, "d": "A", "n": 8}, {"word": "TEN", "clue": "How many sick men did Jesus heal?", "r": 8, "c": 4, "d": "A", "n": 9}, {"word": "BASKETS", "clue": "Twelve ___ of leftovers were picked up", "r": 10, "c": 0, "d": "A", "n": 10}, {"word": "DAVID", "clue": "The king who sang \"Give thanks to the LORD\"", "r": 0, "c": 1, "d": "D", "n": 1}, {"word": "HARVEST", "clue": "Time when crops are gathered in from the fields", "r": 2, "c": 4, "d": "D", "n": 2}, {"word": "FISH", "clue": "The boy also had two small ___", "r": 5, "c": 0, "d": "D", "n": 4}, {"word": "LOAVES", "clue": "The boy had five small ___ of bread", "r": 5, "c": 2, "d": "D", "n": 5}, {"word": "THANKS", "clue": "Jesus looked up and gave ___", "r": 5, "c": 6, "d": "D", "n": 6}]}, "wordsearch": {"grid": ["TJOCUMKTHJF", "GFFBDAVIDUW", "IPCECWESING", "HEBCAYSWMYR", "AFIPRSHTGBW", "RITRNTTHSRI", "VSOAPWVAYEL", "EHCIKUDNPAA", "STVSKGHKADI", "TDYEHLFSTEN", "KNBDEYHBTVS"], "words": ["THANKS", "PRAISE", "SING", "SEA", "FEAST", "HARVEST", "DAVID", "TEN", "BREAD", "FISH"], "locs": {"HARVEST": [3, 0, 1, 0], "THANKS": [4, 7, 1, 0], "PRAISE": [4, 3, 1, 0], "FEAST": [1, 2, 1, 1], "DAVID": [1, 4, 0, 1], "BREAD": [4, 9, 1, 0], "SING": [2, 7, 0, 1], "FISH": [4, 1, 1, 0], "SEA": [5, 8, 1, 1], "TEN": [9, 8, 0, 1]}}, "files": [["🖨️ Kids' handout", "PDF", "files/thanksgiving/week1-kids-handout.pdf", "Bloomers Thanksgiving Week 1 Kids Handout.pdf"], ["📄 Leader guide + activity pages", "PDF", "files/thanksgiving/week1-leader-guide.pdf", "Bloomers Thanksgiving Week 1 Leader Guide.pdf"]]}]}, {"id": "matthew-14", "name": "Matthew 14", "weeks": [{"id": 1, "short": "John the Baptist", "title": "John the Baptist Stands for the Truth", "ref": "Matthew 14:1-12", "emoji": "📜", "bigIdea": "Standing for what is right can be costly. God honors people who stay faithful to him.", "verse": "Be strong and courageous... for the LORD your God will be with you wherever you go.", "verseRef": "Joshua 1:9", "story": [["👑", "Herod's guilty conscience", "Herod Antipas ruled Galilee for the Romans. When he heard about the miracles Jesus was doing, he panicked and told his servants, \"This is John the Baptist, risen from the dead!\" To understand why, we need to go back in time."], ["📣", "John speaks the truth", "Herod had married Herodias, the wife of his own brother Philip. God's law said this was wrong, and John the Baptist told Herod so to his face: \"It is not lawful for you to have her.\""], ["⛓️", "Arrested for the truth", "Herod had John arrested, tied up and thrown into prison. He wanted John dead, but he was afraid of the people, because they believed John was a prophet sent by God."], ["🎂", "A dangerous promise", "At Herod's birthday banquet, Herodias' daughter danced for the guests. Herod was so pleased that he swore an oath in front of everyone: he would give her whatever she asked."], ["😢", "A terrible request", "Her mother told her what to ask for: the death of John the Baptist. Herod was upset, but he did not want to look weak in front of his guests. He kept his foolish promise, and John was put to death in prison."], ["🙏", "John's friends go to Jesus", "John's disciples came, took his body and buried it. Then they went and told Jesus. John had finished the job God gave him. Right to the end, he pointed people to Jesus."]], "discussion": ["Why do you think John was willing to tell a king he was wrong, knowing it could get him in trouble?", "Herod knew killing John was wrong, but he did it anyway to save face. Why do people sometimes do wrong things because of what others will think?", "Where might you need courage to stand for what is right: at school, online, or with friends?", "When John's disciples were heartbroken, they went to Jesus. What can we do when we are sad or hurting?"], "challenge": ["Herod was the most powerful man in the room, but who really had courage? Explain your answer.", "Herod kept a bad promise to protect his reputation. Is it ever right to break a promise? What should he have done?", "Read Matthew 14:13. How did Jesus respond to the news about John? What does that teach us about grief?"], "mc": [["Why did Herod think Jesus was John the Baptist?", ["They looked alike", "His guilty conscience about killing John", "John's disciples told him so", "An angel told him"], 1], ["Why was John put in prison?", ["He refused to pay taxes", "He told Herod his marriage broke God's law", "He led a rebellion", "He stole from the temple"], 1], ["Why didn't Herod kill John right away?", ["He was afraid of the people", "He enjoyed John's preaching", "The Romans would not allow it", "He forgot about him"], 0], ["What did Herod promise at his birthday banquet?", ["A palace", "Whatever the girl asked for", "Freedom for John", "A seat on his council"], 1], ["Why did Herod keep his promise even though he was upset?", ["He wanted to please God", "He did not want to look weak in front of his guests", "The law required it", "John asked him to"], 1], ["What did John's disciples do after burying him?", ["Went into hiding", "Went and told Jesus", "Left Israel", "Started a protest"], 1]], "tf": [["Herod heard about Jesus and thought John had come back from the dead.", true], ["John was afraid to tell Herod the truth.", false], ["The people believed John was a prophet.", true], ["Herod swore an oath in front of his guests.", true], ["Herod was glad when the girl made her request.", false], ["John's disciples went and told Jesus what happened.", true]], "crossword": {"rows": 11, "cols": 10, "words": [{"word": "BURIED", "clue": "John's disciples took his body and ___ it", "r": 1, "c": 0, "d": "A", "n": 3}, {"word": "PRISON", "clue": "Where John was locked up", "r": 4, "c": 4, "d": "A", "n": 5}, {"word": "HEROD", "clue": "The ruler who put John in prison", "r": 6, "c": 1, "d": "A", "n": 6}, {"word": "BIRTHDAY", "clue": "Herod was having a ___ party", "r": 8, "c": 0, "d": "A", "n": 7}, {"word": "TRUTH", "clue": "John always told the ___, even to a king", "r": 10, "c": 4, "d": "A", "n": 8}, {"word": "PROMISE", "clue": "Herod made a foolish ___ at his party", "r": 0, "c": 2, "d": "D", "n": 1}, {"word": "JESUS", "clue": "John's disciples went and told ___", "r": 0, "c": 7, "d": "D", "n": 2}, {"word": "BRAVE", "clue": "John was ___ and spoke up for God", "r": 1, "c": 0, "d": "D", "n": 3}, {"word": "DANCED", "clue": "What the girl did at the party", "r": 2, "c": 9, "d": "D", "n": 4}, {"word": "PROPHET", "clue": "The people believed John was a ___ (God's messenger)", "r": 4, "c": 4, "d": "D", "n": 5}]}, "wordsearch": {"grid": ["PROPHETNBHB", "WJCSTKPKREY", "LUOPTORKARC", "CPTHIPOIVOY", "WRRCNBMNEDP", "YIUJVTIGWOA", "JSTYMWSLAOR", "LOHFUDEPBGT", "JNEHMMPCFOY", "MJESUSSIENS", "IYNLWMHECFE"], "words": ["HEROD", "JOHN", "PRISON", "TRUTH", "PROMISE", "PARTY", "BRAVE", "PROPHET", "JESUS", "KING"], "locs": {"PROMISE": [1, 6, 1, 0], "PROPHET": [0, 0, 0, 1], "PRISON": [3, 1, 1, 0], "HEROD": [0, 9, 1, 0], "TRUTH": [3, 2, 1, 0], "PARTY": [4, 10, 1, 0], "BRAVE": [0, 8, 1, 0], "JESUS": [9, 1, 0, 1], "JOHN": [1, 1, 1, 1], "KING": [2, 7, 1, 0]}}, "games": [["Courage Corners", "Label the four corners of the room A, B, C and D. Read a real-life situation (a friend asks to copy your homework, someone is being left out, a group chat is mocking a classmate) with four possible responses. Kids walk to the corner they would choose. Talk about what courage looks like in each case."], ["Truth or Not?", "Tape TRUE on one wall and FALSE on the other. Read statements from the story (use the True/False list, plus a few trickier ones of your own). Kids move to the right wall. Older kids try to correct each false statement."], ["Pass the Courage", "Like hot potato. Play music and pass a ball. When the music stops, whoever has the ball answers a quiz question or names one way to stand for the truth this week."]], "craft": {"name": "\"Speak the Truth\" Megaphone", "supplies": ["Construction paper or cardstock (one sheet per child)", "Tape or stapler", "Markers, pencil crayons, stickers"], "steps": ["Kids write Joshua 1:9 across a sheet of paper and decorate it.", "Roll the paper into a cone and tape it closed. Trim the big end so it is even.", "Take turns reading the memory verse through the megaphone.", "Talk about it: John used his voice for God. Where can we use ours this week?"]}, "links": [["John the Baptist crafts (camel-hair craft, cup craft, match game)", "https://www.daniellesplace.com/html/bible-crafts-john-the-baptist.html"], ["\"Prepare the Way\" craft ideas (announcement noisemaker, point-the-way map)", "https://ministry-to-children.com/prepare-the-way-for-jesus-bible-crafts/"], ["Death of John the Baptist lesson with free printable picture visuals", "https://www.biblefunforkids.com/2015/05/cathys-corner-death-of-john-baptist.html"]], "prayer": "Dear God, give me courage like John to stand for what is right, even when it is hard or unpopular. Help me care more about pleasing you than impressing others. Thank you that you are with me wherever I go. In Jesus' name, Amen.", "takeaways": ["John told the truth even when it was dangerous, because pleasing God mattered more to him than pleasing a king.", "Herod knew what was right, but pride and fear of what others thought led him to do wrong.", "A promise to do something wrong should never be kept. It is better to admit a mistake.", "Doing right does not always make life easier, but God sees and honors faithfulness.", "When something terrible happened, John's friends went straight to Jesus. We can bring our hurts to him too."], "storyNote": "This story includes a death. For younger kids, say simply that Herod had John killed and skip details about how. Older kids may know verse 11; answer honestly and calmly, then move to what John's courage teaches us. If kids ask about scene 2, keep it simple: Herod broke God's law about marriage, and John was brave enough to say so. Part 1 is a flashback: Herod's guilty conscience made him think Jesus was John come back.", "drawPrompt": "Draw a moment when someone your age might need courage to stand for what is right.", "files": [["🖨️ Kids' handout", "PDF", "files/matthew-14/week1-kids-handout.pdf", "Bloomers Matthew 14 Week 1 Kids Handout.pdf"], ["📄 Leader guide + activity pages", "PDF", "files/matthew-14/week1-leader-guide.pdf", "Bloomers Matthew 14 Week 1 Leader Guide.pdf"]]}, {"id": 2, "short": "Jesus Feeds 5,000", "title": "Jesus Feeds the 5,000", "ref": "Matthew 14:13-21", "emoji": "🍞", "bigIdea": "Jesus cares about people's needs. When we give him what we have, he can do more than we imagine.", "verse": "And my God will meet all your needs according to the riches of his glory in Christ Jesus.", "verseRef": "Philippians 4:19", "story": [["⛵", "Looking for a quiet place", "When Jesus heard what had happened to John, he got into a boat and went to a quiet place to be alone. He was grieving."], ["👥", "Compassion for the crowd", "The crowds found out and followed him on foot from the towns. When Jesus landed and saw them, he did not send them away. He had compassion on them and healed their sick."], ["🌅", "\"You give them something\"", "As evening came, the disciples said, \"This is a remote place, and it's already getting late. Send the crowds away so they can buy food in the villages.\" Jesus answered, \"They do not need to go away. You give them something to eat.\""], ["🍞", "Not nearly enough", "\"We have only five loaves of bread and two fish,\" they said. For thousands of hungry people, that was almost nothing. Jesus said, \"Bring them here to me.\""], ["🙏", "Jesus gives thanks", "Jesus had the people sit down on the grass. He took the loaves and fish, looked up to heaven, gave thanks and broke the bread. Then he gave it to the disciples to hand out."], ["🧺", "Twelve baskets left", "Everyone ate and was satisfied. The disciples picked up twelve baskets full of leftovers. About 5,000 men had eaten, plus women and children."]], "discussion": ["Jesus wanted time alone after hearing about John, but the crowd followed him. How did he respond, and what does that show about him?", "The disciples said, \"Send them away.\" Jesus said, \"You give them something to eat.\" Why do you think he put it back on them?", "What is something small you have (time, a skill, money, kindness) that you could offer to God?", "Why do you think there were twelve full baskets left over?"], "challenge": ["Jesus was sad about John, but he still helped the crowd. What does that show us about Jesus' heart?", "Jesus told the disciples, \"You give them something to eat.\" Why do you think he said that when he knew they did not have enough?", "Philippians 4:19 says God will meet all our needs. What is the difference between a need and a want?"], "mc": [["Why did Jesus go to a quiet place by boat?", ["To go fishing", "He had just heard about John's death", "He was hiding from the Romans", "To visit his family"], 1], ["When Jesus saw the crowd, what did he feel?", ["Annoyed", "Tired of them", "Compassion", "Afraid"], 2], ["What did the disciples want Jesus to do?", ["Send the crowd away to buy food", "Preach longer", "Find a bigger boat", "Call for help"], 0], ["What food did the disciples have?", ["Seven loaves and a few fish", "Five loaves and two fish", "Twelve loaves", "Only water"], 1], ["What did Jesus do before breaking the bread?", ["Looked up to heaven and gave thanks", "Counted the crowd", "Asked for more food", "Sent the disciples to town"], 0], ["How many baskets of leftovers were there?", ["Three", "Five", "Seven", "Twelve"], 3]], "tf": [["Jesus went to a quiet place by boat after hearing about John.", true], ["The crowd stayed home in the towns.", false], ["Jesus healed the sick people in the crowd.", true], ["Jesus told the disciples, \"You give them something to eat.\"", true], ["About 500 men were fed.", false], ["The people sat down on the grass to eat.", true]], "crossword": {"rows": 10, "cols": 10, "words": [{"word": "BOAT", "clue": "Jesus went to a quiet place by ___", "r": 0, "c": 3, "d": "A", "n": 1}, {"word": "FISH", "clue": "They also had two small ___", "r": 2, "c": 1, "d": "A", "n": 4}, {"word": "BASKETS", "clue": "The leftovers were picked up in ___", "r": 4, "c": 3, "d": "A", "n": 7}, {"word": "LOAVES", "clue": "Another word for bread rolls", "r": 6, "c": 0, "d": "A", "n": 9}, {"word": "FIVE", "clue": "How many loaves of bread were there?", "r": 9, "c": 5, "d": "A", "n": 10}, {"word": "THANKS", "clue": "Jesus looked up to heaven and gave ___", "r": 0, "c": 6, "d": "D", "n": 2}, {"word": "GRASS", "clue": "Jesus told the people to sit on the ___", "r": 0, "c": 9, "d": "D", "n": 3}, {"word": "HEALED", "clue": "Jesus ___ the sick people", "r": 2, "c": 4, "d": "D", "n": 5}, {"word": "CROWD", "clue": "A huge ___ followed Jesus on foot", "r": 4, "c": 1, "d": "D", "n": 6}, {"word": "TWELVE", "clue": "How many baskets were left over?", "r": 4, "c": 8, "d": "D", "n": 8}]}, "wordsearch": {"grid": ["PMHOUPCTEPY", "FITOTBFAYMN", "IALYWRTILPI", "SLJROEGBVVS", "HPIDMADBG you for caring about me and giving me what I need. Help me trust you with what I have, even when it seems small, and help me share it with others. In Jesus' name, Amen.", "takeaways": ["Even while grieving, Jesus had compassion on the crowd and met their needs.", "Jesus invited the disciples to be part of the answer: \"You give them something to eat.\"", "What we have may look small, but Jesus can do great things with it when we give it to him.", "Jesus gave thanks before the miracle. Thankfulness and trust go together.", "God provides more than enough: everyone was satisfied, with twelve baskets to spare."], "storyNote": "Scene 1 connects to last week: Jesus had just heard that John had been killed. It is okay to say Jesus was sad; it shows he understands our grief. John 6:9 tells us the loaves and fish came from a boy's lunch, a good detail for older kids. With women and children included, the crowd was likely much bigger than 5,000.", "drawPrompt": "Draw the five loaves and two fish in Jesus' hands. Then write one small thing you can offer to Jesus this week.", "files": [["🖨️ Kids' handout", "PDF", "files/matthew-14/week2-kids-handout.pdf", "Bloomers Matthew 14 Week 2 Kids Handout.pdf"], ["📄 Leader guide + activity pages", "PDF", "files/matthew-14/week2-leader-guide.pdf", "Bloomers Matthew 14 Week 2 Leader Guide.pdf"]]}, {"id": 3, "short": "Jesus Walks on Water", "title": "Jesus Walks on Water", "ref": "Matthew 14:22-33", "emoji": "🌊", "bigIdea": "When life gets stormy, keep your eyes on Jesus. He is the Son of God, and he is right there to help.", "verse": "Take courage! It is I. Don't be afraid.", "verseRef": "Matthew 14:27", "story": [["⛰️", "Jesus prays alone", "After feeding the crowd, Jesus sent the disciples ahead by boat and dismissed the people. Then he went up on a mountainside by himself to pray. He was still there alone when night came."], ["🌬️", "A stormy night", "By now the boat was far from shore, battered by the waves because the wind was against it. The disciples struggled through the night."], ["👻", "\"It's a ghost!\"", "Shortly before dawn, Jesus came toward them, walking on the lake. The disciples were terrified. \"It's a ghost!\" they cried out in fear."], ["🙌", "Take courage!", "Immediately Jesus said, \"Take courage! It is I. Don't be afraid.\" Peter replied, \"Lord, if it's you, tell me to come to you on the water.\" Jesus said, \"Come.\""], ["🌊", "Peter walks, then sinks", "Peter stepped out of the boat and walked on the water toward Jesus. But when he saw the wind, he was afraid and began to sink. He cried out, \"Lord, save me!\""], ["✋", "\"Truly you are the Son of God\"", "Immediately Jesus reached out his hand and caught him. \"You of little faith,\" he said, \"why did you doubt?\" When they climbed into the boat, the wind died down, and the disciples worshiped him, saying, \"Truly you are the Son of God.\""]], "discussion": ["What was Jesus doing on the mountainside before he walked on the water? Why does that matter?", "Peter walked on water. What changed when he looked at the wind instead of Jesus?", "What are some storms (worries or hard situations) kids your age go through?", "What did Jesus do the moment Peter cried for help? What does that tell us about him?"], "challenge": ["Jesus prayed alone before the storm. Why do you think he made time to pray?", "Jesus asked Peter, \"Why did you doubt?\" What does it mean to doubt? How can we grow our faith?", "At the end, the disciples said Jesus is the Son of God. How did this miracle show them who Jesus really is?"], "mc": [["Where did Jesus go after sending the crowd home?", ["Into the temple", "Up a mountainside to pray", "To Peter's house", "Into the boat"], 1], ["Why was the boat in trouble?", ["It had a hole", "The wind was against it and waves battered it", "It was too full of fish", "It hit some rocks"], 1], ["What did the disciples think Jesus was?", ["An angel", "A fisherman", "A ghost", "Elijah"], 2], ["What did Jesus say to the frightened disciples?", ["\"Row harder!\"", "\"Take courage! It is I. Don't be afraid.\"", "\"Go back to shore.\"", "\"Why are you awake?\""], 1], ["Why did Peter begin to sink?", ["He saw the wind and was afraid", "He was carrying too much", "He slipped on a wave", "Jesus walked away"], 0], ["What did the disciples say when the wind stopped?", ["\"Let's go home\"", "\"Truly you are the Son of God\"", "\"That was close\"", "\"We should have stayed on land\""], 1]], "tf": [["Jesus went up a mountainside to pray by himself.", true], ["The night was calm with no wind.", false], ["The disciples thought Jesus was a ghost.", true], ["Peter walked on the water toward Jesus.", true], ["Jesus waited a long time before helping Peter.", false], ["When they got into the boat, the wind died down.", true]], "crossword": {"rows": 11, "cols": 11, "words": [{"word": "PRAY", "clue": "Jesus went up the mountain to ___", "r": 1, "c": 2, "d": "A", "n": 2}, {"word": "WORSHIPED", "clue": "At the end, the disciples ___ Jesus", "r": 4, "c": 1, "d": "A", "n": 5}, {"word": "HAND", "clue": "Jesus reached out his ___ and caught Peter", "r": 6, "c": 0, "d": "A", "n": 7}, {"word": "COURAGE", "clue": "\"Take ___! It is I.\"", "r": 8, "c": 4, "d": "A", "n": 9}, {"word": "SINK", "clue": "When Peter got scared, he began to ___", "r": 10, "c": 0, "d": "A", "n": 10}, {"word": "WAVES", "clue": "The boat was hit by big ___", "r": 0, "c": 4, "d": "D", "n": 1}, {"word": "WIND", "clue": "The ___ was blowing against the boat", "r": 1, "c": 9, "d": "D", "n": 3}, {"word": "MOUNTAIN", "clue": "Jesus went up on a ___ by himself", "r": 3, "c": 2, "d": "D", "n": 4}, {"word": "PETER", "clue": "The disciple who walked on water", "r": 4, "c": 7, "d": "D", "n": 6}, {"word": "GHOST", "clue": "The disciples thought Jesus was a ___", "r": 6, "c": 5, "d": "D", "n": 8}]}, "wordsearch": {"grid": ["FAITHWSMGKE", "SSINKINJLOR", "MKHPMNJESUS", "BOATIDACFYY", "PANPCSURHTU", "KSDUGDFWFVL", "KLUPHWAVESJ", "HDFEOCFNLFW", "BWRTSWHPRAY", "NFTETALPRMW", "HHFRSCONPBJ"], "words": ["BOAT", "WIND", "WAVES", "GHOST", "PETER", "SINK", "HAND", "PRAY", "FAITH", "JESUS"], "locs": {"WAVES": [6, 5, 0, 1], "GHOST": [5, 4, 1, 0], "PETER": [6, 3, 1, 0], "FAITH": [0, 0, 0, 1], "JESUS": [2, 6, 0, 1], "BOAT": [3, 0, 0, 1], "WIND": [0, 5, 1, 0], "SINK": [1, 1, 0, 1], "HAND": [2, 2, 1, 0], "PRAY": [8, 7, 0, 1]}}, "games": [["Keep Your Eyes on Jesus", "Put a line of tape on the floor (the \"water\"). Tape a picture of Jesus on the far wall. One child at a time walks the line looking only at Jesus while the others make storm noises (no touching). If they look away, they \"sink\" and start again."], ["Peter, Come!", "Like Red Light, Green Light. The leader is at the far end. When the leader says \"Come!\" kids walk toward them. When the leader shouts \"WIND!\" everyone freezes. Anyone who moves \"sinks\" and goes back to the start until someone calls \"Lord, save me!\""], ["Sink or Float", "Fill a clear tub with water. Hold up items (coin, sponge, rock, cork, spoon, leaf). Kids predict sink or float before you drop each one in. Then ask: what would happen to a person? Walking on water is something only God can do."]], "craft": {"name": "Walking on Water Slider", "supplies": ["Paper plates or blue cardstock", "Craft sticks (popsicle sticks)", "Small printed or drawn Jesus and Peter figures", "Crayons, glue, scissors, cotton balls (clouds)"], "steps": ["Color the paper plate like a stormy sea: blue waves on the bottom half, a dark sky on top. Glue cotton balls as clouds.", "Leader cuts a long slit across the waves (use a craft knife before class).", "Kids color Jesus and Peter and glue each to a craft stick.", "Push the sticks up through the slit from behind so Jesus and Peter can \"walk\" across the water. Drop Peter down to show him sinking, and bring Jesus over to save him."]}, "links": [["Jesus Walks on Water craft ideas (with printable directions)", "https://ministry-to-children.com/jesus-walks-on-water-craft/"], ["Jesus Walks on Water lesson with the \"Keep Your Eyes on Jesus\" game", "https://ministry-to-children.com/lesson-jesus-walks-on-water/"], ["Free Jesus Walks on Water coloring page", "https://ministry-to-children.com/jesus-walks-on-water-coloring-page/"], ["All Jesus Walks on Water resources (skit, preschool craft, more)", "https://ministry-to-children.com/bible/jesus-walks-on-water/"]], "prayer": "Dear Jesus, when I am scared, help me keep my eyes on you. Thank you for always reaching out your hand to help me. You are the Son of God! In Jesus' name, Amen.", "takeaways": ["Jesus made time to pray, even after a long and busy day.", "Jesus came to his disciples in the middle of the storm. He does not leave us alone in hard times.", "Peter did the impossible while his eyes were on Jesus. Fear took over when he looked at the wind.", "When Peter cried for help, Jesus saved him immediately. We can always call on him.", "This miracle showed the disciples who Jesus really is: the Son of God, worthy of worship."], "storyNote": "Kids may ask whether Peter failed. Point out that Peter was the only one brave enough to step out, and when he started to sink he did the right thing: he called on Jesus. Mark 6:48 tells us this happened in the fourth watch of the night, between about 3 and 6 a.m. Talk about the storms kids face (worries, family changes, school stress) gently, without pressing anyone to share.", "drawPrompt": "Draw Peter and Jesus on the water. Then write one worry you can hand over to Jesus.", "files": [["🖨️ Kids' handout", "PDF", "files/matthew-14/week3-kids-handout.pdf", "Bloomers Matthew 14 Week 3 Kids Handout.pdf"], ["📄 Leader guide + activity pages", "PDF", "files/matthew-14/week3-leader-guide.pdf", "Bloomers Matthew 14 Week 3 Leader Guide.pdf"]]}]}, {"id": "matthew-15", "name": "Matthew 15", "weeks": [{"id": 1, "short": "From the Heart", "title": "A Heart That Worships and Trusts", "ref": "Matthew 15:1-28", "emoji": "❤️", "bigIdea": "God looks at our hearts. Worship him from your heart and trust him with great faith.", "verse": "People look at the outward appearance, but the LORD looks at the heart.", "verseRef": "1 Samuel 16:7", "story": [["🧼", "A question about hands", "Some Pharisees and teachers of the law came all the way from Jerusalem with a complaint: \"Why don't your disciples wash their hands before they eat, the way our tradition says?\" They cared a lot about rules for the outside."], ["🗣️", "Lips and hearts", "Jesus told them God's words from long ago: \"These people honor me with their lips, but their hearts are far from me.\" They said nice words to God, but their hearts were not really with him."], ["❤️", "What comes from the heart", "Jesus told the crowd, \"What goes into someone's mouth does not make them unclean. What comes out of their mouth does.\" Evil thoughts, lies, cruel words and hurting others all start in the heart. God cares most about what is inside us."], ["🙏", "A mom who needed help", "Then Jesus went to the area of Tyre and Sidon. A Canaanite woman, who was not Jewish, came crying out, \"Lord, Son of David, have mercy on me! My daughter is suffering terribly.\" At first Jesus did not answer, and the disciples wanted to send her away."], ["🍞", "She kept on asking", "She knelt in front of Jesus and said, \"Lord, help me!\" Jesus told her his work was first for the people of Israel, like bread for the children of the house. She answered, \"Yes, Lord, but even the little dogs eat the crumbs that fall from the table.\""], ["⭐", "Great faith!", "Jesus said, \"Woman, you have great faith! Your request is granted.\" Her daughter was healed at that very moment. She trusted Jesus with her whole heart, and she did not give up."]], "storyNote": "Hand-washing: the Pharisees' rule was a religious ceremony, not about germs. If kids joke that Jesus says we don't have to wash our hands, remind them we still do! Older kids can read the full list in Matthew 15:19. The Bible says the daughter was troubled by a de }

const hashRaw = (location.hash || "").slice(1), hm = hashRaw.match(/^(.+)-w(\d+)$/), hashId = hm ? hm[1] : hashRaw, hashWeek = hm ? +hm[2] : 1; if (hashId) { pending = { series: hashId, week: hashWeek, section: "story" }; if (SERIES.some(x => x.id === hashId)) { applyPos(pending); pending = null; } }
function save() { try { localStorage.setItem("bloomers-pos", JSON.stringify({ series, week, section })); } catch (e) {} }

  const w = W();
  $("#hero").innerHTML = `<div class="big" aria-hidden="true">${esc(w.emoji)}</div><div><div class="ref">Week ${w.id} · ${esc(w.ref)}</div><h1>${esc(w.title)}</h1><p><strong>Big idea:</strong> ${esc(w.bigIdea)}</p>${(w.files || []).length ? `<div class="printables">${w.files.map(([label, kind, path], i) => `<a class="dl" href="${esc(path)}" target="_blank" rel="noopener" data-dl="${i}">${label} <small>${kind}</small></a>`).join("")}<span class="dlmsg" id="dlmsg" aria-live="polite"></span></div>` : ""}${tButton(cur, w)}${w.added ? `<div class="mine"><span class="tag">${w.added.source === "local" ? "Saved on this device" : "Added lesson"}</span>${canModify(w) ? `<button class="minibtn" data-mine="edit">✏️ Edit</button><button class="minibtn" data-mine="del">Remove</button>` : ""}${w.added.source === "local" ? `<button class="minibtn" data-mine="copy">📋 Copy to share</button>` : ""}<span class="dlmsg" id="minemsg" aria-live="polite"></span></div>` : ""}</div>`;
  $("#tabs").innerHTML = avail().map(([k, l]) => `<button class="tab" role="tab" aria-selected="${k === section}" data-s="${k}">${l}</button>`).join("");

let downloadsApi = null;

$("#series").addEventListener("change", e => { setSeries(e.target.value); week = 1; section = "story"; render(); });
$("#weeks").addEventListener("click", e => { const b = e.target.closest("[data-w]"); if (!b) return; week = +b.dataset.w; render(); });
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (!b) return; section = b.dataset.s; render(); });

function avail() { const w = W(); return SECTIONS.filter(([k]) => k === "story" ? (w.story || []).length > 0 : k === "verse" ? !!w.verse : k === "quiz" ? (w.mc || []).length > 0 : k === "tf" ? (w.tf || []).length > 0 : k === "cross" ? !!(w.crossword && w.crossword.words.length) : k === "search" ? !!(w.wordsearch && w.wordsearch.words.length) : true); }
function nextSection() { const a = avail(), i = a.findIndex(s => s[0] === section); if (i > -1 && i < a.length - 1) { section = a[i + 1][0]; render(); window.scrollTo({ top: 0, behavior: "smooth" }); } }
const nextBtn = label => { const a = avail(), i = a.findIndex(s => s[0] === section), nx = a[i + 1]; if (!nx) return ""; const di = SECTIONS.findIndex(s => s[0] === section), usual = SECTIONS[di + 1] && SECTIONS[di + 1][0] === nx[0]; return `<button class="btn" data-act="nextsec">${usual ? label : nx[1].replace(/^\S+\s/, "")} →</button>`; };

/* ---------- story ---------- */
const storyLen = w => w.story.length + (w.takeaways && w.takeaways.length ? 1 : 0);
function story() {
  const w = W(), s = S(), n = storyLen(w);
  const isRecap = s.scene >= w.story.length;
  const body = isRecap
    ? `<div class="scene anim recap" key="recap"><div class="art" aria-hidden="true">📝</div>
  <div><div class="step">Part ${n} of ${n} · Lesson recap</div><h3>What We Learned</h3><ul>${w.takeaways.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div></div>`
    : (() => { const [emo, head, txt] = w.story[s.scene]; return `<div class="scene anim" key="${s.scene}"><div class="art" aria-hidden="true">${esc(emo)}</div>
  <div><div class="step">Part ${s.scene + 1} of ${n}</div><h3>${esc(head)}</h3><p>${esc(txt)}</p></div></div>`; })();
  return `<h2>The Story</h2><p class="lead">${esc(w.ref)} · tap Next to move through the story</p>
  ${body}
  <div class="nav"><button class="btn ghost" data-act="sprev" ${s.scene === 0 ? "disabled" : ""}>← Back</button>
  <div class="dots">${Array.from({ length: n }, (_, i) => `<button class="dot" aria-label="Part ${i + 1}" aria-current="${i === s.scene}" data-act="sgo" data-i="${i}"></button>`).join("")}</div>
  ${s.scene < n - 1 ? `<button class="btn" data-act="snext">Next →</button>` : nextBtn("Memory verse")}</div>`;
}

/* ---------- verse ---------- */
function verseWords() { return W().verse.split(" "); }
function verse() {
  const w = W(), s = S(), words = verseWords();
  if (!s.verseOrder) s.verseOrder = shuffle(words.map((_, i) => i), week * 31 + 7);
  const mode = `<div class="mode"><button class="btn ${s.vmode === "build" ? "" : "ghost"}" data-act="vmode" data-m="build">Build the verse</button><button class="btn ${s.vmode === "hide" ? "" : "ghost"}" data-act="vmode" data-m="hide">Hide the words</button></div>`;
  let body;
  if (s.vmode === "build") {
    const done = s.verseBuilt.length === words.length;
    body = `<p class="lead">Tap the words in the right order. ${esc(w.verseRef)}</p>
    <div class="verse-target ${done ? "done" : ""}">${s.verseBuilt.map(i => `<span class="chip placed">${esc(words[i])}</span>`).join("") || `<span style="color:var(--muted)">The verse will grow here...</span>`}</div>
    <div class="chips">${s.verseOrder.filter(i => !s.verseBuilt.includes(i)).map(i => `<button class="chip" data-act="vword" data-i="${i}">${esc(words[i])}</button>`).join("")}</div>
    <div class="status ${done ? "good" : ""}">${done ? `🎉 You did it! "${esc(w.verse)}" ${esc(w.verseRef)}` : ""}</div>
    <div class="row-btns"><button class="btn ghost" data-act="vreset">Start over</button></div>`;
  } else {
