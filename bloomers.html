    <div class="verse-full">${words.map((wd, i) => s.gaps.includes(i) ? `<span class="gap" data-act="peek">${esc(wd)}</span>` : esc(wd)).join(" ")}<div style="font-size:.6em;color:var(--accent);margin-top:10px">${esc(w.verseRef)}</div></div>
    <div class="row-btns"><button class="btn" data-act="vhide" ${s.gaps.length === words.length ? "disabled" : ""}>Hide a word</button><button class="btn ghost" data-act="vshow">Show all</button></div>`;
  }
  return `<h2>Memory Verse</h2>${mode}${body}<div class="nav"><span></span>${nextBtn("Quiz time")}</div>`;
}

/* ---------- quiz ---------- */
function quiz() {
  const w = W(), s = S(), n = w.mc.length;
  if (s.q >= n) return `<div class="score"><div class="num">${s.qScore}/${n}</div><p>${s.qScore === n ? "Perfect score! 🌟" : s.qScore >= n - 2 ? "Great job, Bloomers! 🌸" : "Good try! Let's look at the story again."}</p><div class="row-btns" style="justify-content:center"><button class="btn ghost" data-act="qreset">Play again</button>${nextBtn("True or False")}</div></div>`;
  const [q, opts, a] = w.mc[s.q], picked = s.qPicked;
  return `<div class="qcount">Question ${s.q + 1} of ${n} · Score ${s.qScore}</div><div class="question">${esc(q)}</div>
  <div class="opts">${opts.map((o, i) => `<button class="opt ${picked !== null && i === a ? "right" : ""} ${picked === i && i !== a ? "wrongpick" : ""}" data-act="qpick" data-i="${i}" ${picked !== null ? "disabled" : ""}><span class="letter">${"ABCD"[i]}</span>${esc(o)}</button>`).join("")}</div>
  <div class="feedback ${picked === null ? "" : picked === a ? "good" : "bad"}">${picked === null ? "" : picked === a ? "✓ That's right!" : `Not quite. The answer is ${"ABCD"[a]}.`}</div>
  <div class="nav"><span></span>${picked !== null ? `<button class="btn" data-act="qnext">${s.q === n - 1 ? "See score" : "Next question"} →</button>` : ""}</div>`;
}

/* ---------- true / false ---------- */
function tf() {
  const w = W(), s = S(), n = w.tf.length;
  if (s.t >= n) return `<div class="score"><div class="num">${s.tScore}/${n}</div><p>${s.tScore === n ? "You know this story! 🌟" : "Nice work! 🌸"}</p><div class="row-btns" style="justify-content:center"><button class="btn ghost" data-act="treset">Play again</button>${nextBtn("Crossword")}</div></div>`;
  const [q, v] = w.tf[s.t], p = s.tPicked;
  const cls = val => p === null ? "" : val === v ? "right" : p === val ? "wrongpick" : "";
  return `<div class="qcount">Sentence ${s.t + 1} of ${n} · Score ${s.tScore}</div><div class="question">${esc(q)}</div>
  <div class="tfbtns"><button class="tfbtn ${cls(true)}" data-act="tpick" data-v="1" ${p !== null ? "disabled" : ""}>👍 TRUE</button><button class="tfbtn ${cls(false)}" data-act="tpick" data-v="0" ${p !== null ? "disabled" : ""}>👎 FALSE</button></div>
  <div class="feedback ${p === null ? "" : p === v ? "good" : "bad"}">${p === null ? "" : p === v ? "✓ Correct!" : `Oops! It's ${v ? "TRUE" : "FALSE"}.`}</div>
  <div class="nav"><span></span>${p !== null ? `<button class="btn" data-act="tnext">${s.t === n - 1 ? "See score" : "Next"} →</button>` : ""}</div>`;
}

/* ---------- crossword ---------- */
let cwActive = null;
function cwCells(wd) { const [dr, dc] = wd.d === "A" ? [0, 1] : [1, 0]; return [...wd.word].map((ch, i) => [wd.r + dr * i, wd.c + dc * i, ch]); }
function cross() {
  const cw = W().crossword, s = S();
  const map = {}, nums = {};
  cw.words.forEach(wd => { nums[wd.r + "," + wd.c] = wd.n; cwCells(wd).forEach(([r, c, ch]) => map[r + "," + c] = ch); });
  let cells = "";
  for (let r = 0; r < cw.rows; r++) for (let c = 0; c < cw.cols; c++) {
    const k = r + "," + c;
    cells += map[k] ? `<div class="cell">${nums[k] ? `<span class="num">${nums[k]}</span>` : ""}<input id="cw-${week}-${r}-${c}" data-k="${k}" maxlength="1" value="${esc(s.cwVals[k] || "")}" aria-label="Row ${r + 1} column ${c + 1}" autocomplete="off"></div>` : `<div></div>`;
  }
  const solved = wd => cwCells(wd).every(([r, c, ch]) => (s.cwVals[r + "," + c] || "").toUpperCase() === ch);
  const list = d => cw.words.map((wd, i) => wd.d === d ? `<li><button class="clue ${solved(wd) ? "solved" : ""}" data-act="clue" data-i="${i}"><b>${wd.n}</b>${esc(wd.clue)} (${wd.word.length})</button></li>` : "").join("");
  return `<h2>Crossword</h2><p class="lead">Tap a clue to light up its squares, then type the answer.</p>
  <div class="cw-layout"><div class="cw-scroll"><div class="cw" style="grid-template-columns:repeat(${cw.cols}, auto)">${cells}</div></div>
  <div class="clues"><h3>➡️ Across</h3><ol>${list("A")}</ol><h3>⬇️ Down</h3><ol>${list("D")}</ol></div></div>
  <div class="row-btns"><button class="btn" data-act="cwcheck">Check answers</button><button class="btn ghost" data-act="cwreveal">Show answers</button><button class="btn ghost" data-act="cwclear">Clear</button></div>
  <div class="status" id="cwstatus"></div><div class="nav"><span></span>${nextBtn("Word search")}</div>`;
}
function cwHighlight(i) {
  cwActive = i; const wd = W().crossword.words[i];
  document.querySelectorAll(".cell input").forEach(x => x.classList.remove("hl"));
  document.querySelectorAll(".clue").forEach(x => x.classList.toggle("active", +x.dataset.i === i));
  cwCells(wd).forEach(([r, c]) => { const el = document.getElementById(`cw-${week}-${r}-${c}`); el && el.classList.add("hl"); });
}
document.addEventListener("input", e => {
  if (!e.target.matches(".cell input")) return;
  const el = e.target, k = el.dataset.k; el.value = el.value.slice(-1).toUpperCase(); S().cwVals[k] = el.value; el.classList.remove("ok", "no");
  if (el.value && cwActive !== null) { const cells = cwCells(W().crossword.words[cwActive]); const idx = cells.findIndex(([r, c]) => r + "," + c === k);
    if (idx > -1 && idx < cells.length - 1) { const [r, c] = cells[idx + 1]; document.getElementById(`cw-${week}-${r}-${c}`)?.focus(); } }
  const cw = W().crossword;
  document.querySelectorAll(".clue").forEach(b => { const wd = cw.words[+b.dataset.i]; b.classList.toggle("solved", cwCells(wd).every(([r, c, ch]) => (S().cwVals[r + "," + c] || "") === ch)); });
});
document.addEventListener("focusin", e => {
  if (!e.target.matches(".cell input")) return;
  const k = e.target.dataset.k, cw = W().crossword;
  if (cwActive !== null && cwCells(cw.words[cwActive]).some(([r, c]) => r + "," + c === k)) return;
  const i = cw.words.findIndex(wd => cwCells(wd).some(([r, c]) => r + "," + c === k)); if (i > -1) cwHighlight(i);
});

/* ---------- word search ---------- */
let wsStart = null;
function search() {
  const ws = W().wordsearch, s = S(), n = ws.grid.length;
  const foundCells = new Set();
  s.found.forEach(wd => { const [r, c, dr, dc] = ws.locs[wd]; for (let i = 0; i < wd.length; i++) foundCells.add((r + dr * i) + "," + (c + dc * i)); });
  let cells = "";
  ws.grid.forEach((row, r) => [...row].forEach((ch, c) => { const k = r + "," + c; cells += `<button data-act="ws" data-r="${r}" data-c="${c}" class="${foundCells.has(k) ? "found" : ""} ${wsStart && wsStart[0] === r && wsStart[1] === c ? "sel" : ""}" aria-label="${ch}">${ch}</button>`; }));
  const all = s.found.length === ws.words.length;
  return `<h2>Word Search</h2><p class="lead">Tap the first letter of a word, then tap the last letter. Words go across, down, or slanted.</p>
  <div class="ws-layout"><div class="cw-scroll"><div class="ws" style="grid-template-columns:repeat(${n}, auto)">${cells}</div></div>
  <div><div class="wordlist">${ws.words.map(wd => `<span class="${s.found.includes(wd) ? "found" : ""}">${wd}</span>`).join("")}</div>
  <div class="status ${all ? "good" : ""}">${all ? "🎉 You found them all!" : `Found ${s.found.length} of ${ws.words.length}`}</div>
  <div class="row-btns"><button class="btn ghost" data-act="wsreset">Start over</button></div></div></div>
  <div class="nav"><span></span>${nextBtn("Talk & games")}</div>`;
}
function wsPick(r, c) {
  const ws = W().wordsearch, s = S();
  if (!wsStart) { wsStart = [r, c]; return; }
  const [r0, c0] = wsStart; wsStart = null;
  for (const wd of ws.words) { if (s.found.includes(wd)) continue; const [wr, wc, dr, dc] = ws.locs[wd]; const er = wr + dr * (wd.length - 1), ec = wc + dc * (wd.length - 1);
    if ((r0 === wr && c0 === wc && r === er && c === ec) || (r === wr && c === wc && r0 === er && c0 === ec)) { s.found.push(wd); return; } }
}

/* ---------- talk & games ---------- */
function talk() {
  const w = W(), s = S();
  const qs = [...(w.discussion || []).map(q => [q, false]), ...(w.challenge || []).map(q => [q, true])];
  const craft = w.craft && (w.craft.name || (w.craft.steps || []).length) ? w.craft : null;
  const out = [];
  if (qs.length) out.push(`<h2>Let's Talk</h2><p class="lead">Tap a card to show the question.${(w.challenge || []).length ? " ⭐ cards are challenge questions for ages 10-13." : ""}</p>
  <div class="cards">${qs.map(([q, star], i) => `<button class="flip ${star ? "star" : ""} ${s.revealed.includes(i) ? "" : "hide"}" data-act="flip" data-i="${i}"><span class="lbl">${star ? "⭐ Challenge" : "Question " + (i + 1)}</span><span class="q">${s.revealed.includes(i) ? esc(q) : "Tap to show the question so nobody peeks early"}</span></button>`).join("")}</div>`);
  else out.push(`<h2>Talk & Games</h2>`);
  if ((w.games || []).length) out.push(`<h3 class="sub">🎮 Games</h3><div class="games">${w.games.map(([n, h]) => `<div class="game"><h3>${esc(n)}</h3><p>${esc(h)}</p></div>`).join("")}</div>`);
  if (craft) out.push(`<h3 class="sub">✂️ Craft${craft.name ? ": " + esc(craft.name) : ""}</h3>${w.added && (craft.supplies || []).length ? `<p style="margin-top:0"><strong>You need:</strong> ${craft.supplies.map(esc).join(", ")}</p>` : ""}<p style="margin-top:0">${(craft.steps || []).map(esc).join(" ")}</p>`);
  if ((w.links || []).length) out.push(`<ul class="links">${w.links.map(([l, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)} ↗</a></li>`).join("")}</ul>`);
  if (w.prayer) out.push(`<div class="prayer"><b>🙏 Let's pray</b>${esc(w.prayer)}</div>`);
  if (out.length === 1 && !qs.length) out.push(`<p class="empty">Nothing here yet for this lesson.</p>`);
  return out.join("\n  ");
}

const RENDER = { story, verse, quiz, tf, cross, search, talk };
function render() { if (!avail().some(s => s[0] === section)) section = avail()[0][0]; renderTop(); cwActive = null; wsStart = null; $("#panel").innerHTML = RENDER[section](); save(); }
function rerender() { $("#panel").innerHTML = RENDER[section](); }

$("#panel").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const s = S(), w = W(), a = b.dataset.act, i = +b.dataset.i;
  switch (a) {
    case "nextsec": return nextSection();
    case "snext": s.scene++; break; case "sprev": s.scene--; break; case "sgo": s.scene = i; break;
    case "vmode": s.vmode = b.dataset.m; break;
    case "vword": if (verseWords()[i] === verseWords()[s.verseBuilt.length]) { s.verseBuilt.push(s.verseBuilt.length); } else { b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); return; } break;
    case "vreset": s.verseBuilt = []; break;
    case "vhide": { const left = verseWords().map((_, k) => k).filter(k => !s.gaps.includes(k)); s.gaps.push(left[Math.floor(Math.random() * left.length)]); break; }
    case "vshow": s.gaps = []; break;
    case "peek": b.classList.toggle("show"); return;
    case "qpick": s.qPicked = i; if (i === w.mc[s.q][2]) s.qScore++; break;
    case "qnext": s.q++; s.qPicked = null; break;
    case "qreset": s.q = 0; s.qScore = 0; s.qPicked = null; break;
    case "tpick": { const v = b.dataset.v === "1"; s.tPicked = v; if (v === w.tf[s.t][1]) s.tScore++; break; }
    case "tnext": s.t++; s.tPicked = null; break;
    case "treset": s.t = 0; s.tScore = 0; s.tPicked = null; break;
    case "clue": { cwHighlight(i); const [r, c] = cwCells(w.crossword.words[i]).find(([r, c]) => !S().cwVals[r + "," + c]) || cwCells(w.crossword.words[i])[0]; document.getElementById(`cw-${week}-${r}-${c}`)?.focus(); return; }
    case "cwcheck": { let right = 0, total = 0; document.querySelectorAll(".cell input").forEach(el => { const [r, c] = el.dataset.k.split(",").map(Number); const ch = w.crossword.words.flatMap(cwCells).find(x => x[0] === r && x[1] === c)[2]; total++; el.classList.remove("ok", "no"); if (el.value) { if (el.value === ch) { el.classList.add("ok"); right++; } else el.classList.add("no"); } });
      const st2 = $("#cwstatus"); st2.textContent = right === total ? "🎉 Every square is right!" : `${right} of ${total} squares are right so far.`; st2.className = "status" + (right === total ? " good" : ""); return; }
    case "cwreveal": w.crossword.words.forEach(wd => cwCells(wd).forEach(([r, c, ch]) => s.cwVals[r + "," + c] = ch)); break;
    case "cwclear": s.cwVals = {}; break;
    case "ws": wsPick(+b.dataset.r, +b.dataset.c); break;
    case "wsreset": s.found = []; break;
    case "flip": if (!s.revealed.includes(i)) s.revealed.push(i); break;
  }
  rerender();
});
document.addEventListener("keydown", e => {
  if (section !== "story" || e.target.matches("input, textarea, select") || $("#addDlg").open) return;
  const s = S(), n = storyLen(W());
  if (e.key === "ArrowRight" && s.scene < n - 1) { s.scene++; rerender(); }
  if (e.key === "ArrowLeft" && s.scene > 0) { s.scene--; rerender(); }
});
let hdone = {}; try { hdone = JSON.parse(localStorage.getItem("bloomers-done") || "{}") || {}; } catch (e) {}
const doneKey = (s, w) => s.id + ":" + (w.added ? w.added.key : "w" + w.id);
let hq = "", hopen = null;
window.tRefresh=function(){if(document.body.classList.contains("home"))renderHome()};
function renderHome() {
  hush0(); document.body.classList.add("home"); document.body.dataset.week = "1";
  $("#brandname").textContent = "Bloomers";
  if (!hopen) { hopen = {}; SERIES.forEach((s, i) => { hopen[s.id] = false; }); }
  const hv = $("#homeView"); hv.hidden = false;
  hv.innerHTML = `<section class="hintro"><div><h1>Bloomers Lessons</h1><p>Bible lessons for ages 6-13. Tap a lesson to teach it.</p></div><button class="addbtn" data-addlesson type="button">＋ Add a lesson</button></section>
  <div class="hfind"><input id="hsearch" type="search" placeholder="Search lessons: a title, Bible book or topic" value="${esc(hq)}" aria-label="Search lessons"></div>` +
    SERIES.map(s => `<details class="hgroup" id="g-${esc(s.id)}" data-g="${esc(s.id)}" ${hopen[s.id] ? "open" : ""}><summary><span class="hseries">${esc(s.name)}</span><span class="hcount">${s.weeks.length} ${s.weeks.length === 1 ? "lesson" : "lessons"}</span></summary><div class="hlist">${s.weeks.map(w => `<div class="hitem" data-open="${esc(s.id)}" data-w="${w.id}" data-text="${esc((s.name + " " + w.title + " " + w.ref + " " + w.bigIdea).toLowerCase())}" role="button" tabindex="0"><div class="em" aria-hidden="true">${esc(w.emoji)}</div><div><div class="ref">${s.weeks.length > 1 ? "Week " + w.id + " · " : ""}${esc(w.ref)}</div><h3>${esc(w.title)}</h3><p>${esc(w.bigIdea)}</p></div><span class="hside">${tBadge(s,w)}<span class="hgo" aria-hidden="true">→</span></span></div>`).join("")}</div></details>`).join("") +
    `<p class="hnone" id="hnone" hidden>No lessons match your search.</p>`;
  applySearch();
}
function applySearch() {
  const q = hq.trim().toLowerCase(); let any = false;
  document.querySelectorAll(".hgroup").forEach(g => {
    let n = 0; g.querySelectorAll(".hitem").forEach(it => { const ok = !q || it.dataset.text.includes(q); it.hidden = !ok; if (ok) n++; });
    g.hidden = n === 0; if (q && n) g.open = true; if (n) any = true;
  });
  const none = $("#hnone"); if (none) none.hidden = any;
}
function hush0() {}
function openLesson(id, wk) { setSeries(id); week = Math.min(wk, WEEKS.length) || 1; section = "story"; document.body.classList.remove("home"); $("#homeView").hidden = true; render(); window.scrollTo({ top: 0 }); }
$("#homeView").addEventListener("click", e => {
  if (e.target.closest("[data-addlesson]")) return openForm(null);
  const j = e.target.closest("[data-jump]");
  if (j) { const g = document.getElementById("g-" + j.dataset.jump); if (g) { g.open = true; hopen[j.dataset.jump] = true; g.scrollIntoView({ behavior: "smooth", block: "start" }); } return; }
  const o = e.target.closest("[data-open]"); if (o) openLesson(o.dataset.open, +o.dataset.w);
});
$("#homeView").addEventListener("input", e => { if (e.target.id === "hsearch") { hq = e.target.value; applySearch(); } });
$("#homeView").addEventListener("toggle", e => { const g = e.target.closest && e.target.closest(".hgroup"); if (g && !hq) hopen[g.dataset.g] = g.open; }, true);
$("#homeView").addEventListener("keydown", e => { const o = e.target.closest("[data-open]"); if (o && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openLesson(o.dataset.open, +o.dataset.w); } });
$("#allBtn").addEventListener("click", renderHome);
render();
if (!(location.hash || "").slice(1)) renderHome();
(async () => {
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  try { userApi = await window.claude?.use?.("user"); } catch (e) { userApi = null; }
  if (userApi) {
    try { isOwner = !!(await userApi.isOwner()); } catch (e) {}
    try { const c = await userApi.can("data.write"); canShared = c === null || c === undefined ? null : !!c; } catch (e) {}
    try { me = await userApi.id(); } catch (e) {}
  }
  if (!db) { canShared = false; if (pending && applyPos(pending)) render(); pending = null; return; }
  db.collection("lessons").limit(500).onSnapshot(snap => {
    SHARED = snap.docs.filter(d => d.exists).map(d => ({ ...d.data(), key: d.id }));
    rebuild();
    if (pending && applyPos(pending)) pending = null;
    if (!snap.metadata.fromCache) pending = null;
    render(); if (document.body.classList.contains("home")) renderHome();
  }, () => {});
})();
