<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buds Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* VOICE: warm, playful, calm for ages 1-5; teacher drives a classroom screen.
   IDEA: a picture book on the wall; one big picture at a time.
   PICTURE: huge emoji scenes the kids tap.
   COLOUR+TYPE: cream paper, deep plum ink, leaf green brand, week accent; Fredoka + Atkinson.
   LAYOUT: lesson list home, then one tab at a time with giant targets. */
:root{color-scheme:light dark;
 --bg:light-dark(#FFF9EF,#17121F);--paper:light-dark(#FFFFFF,#221B2E);--ink:light-dark(#2B2340,#F3EEF8);--muted:light-dark(#6B6080,#B5AAC6);
 --line:light-dark(#EADFD0,#3A3049);--soft:light-dark(#F6EEE2,#2C2340);--leaf:light-dark(#3F8F3A,#7BD07A);--sun:#FACC15;
 --good:light-dark(#15803D,#4ADE80);--goodbg:light-dark(#DCFCE7,#14321F);--bad:light-dark(#B91C1C,#F87171);
 --w1:light-dark(#C2410C,#FB923C);--w1s:light-dark(#FFEDD5,#3A2114);--w2:light-dark(#A16207,#FBBF24);--w2s:light-dark(#FEF3C7,#3A2E10);
 --w3:light-dark(#1D4ED8,#60A5FA);--w3s:light-dark(#DBEAFE,#16264A);--w4:light-dark(#0F766E,#2DD4BF);--w4s:light-dark(#CCFBF1,#10302C);
 --w5:light-dark(#BE185D,#F472B6);--w5s:light-dark(#FCE7F3,#3A1426);
 --acc:var(--leaf);--accs:light-dark(#E5F4E4,#16301A);
 --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
body[data-week="1"]{--acc:var(--w1);--accs:var(--w1s)}body[data-week="2"]{--acc:var(--w2);--accs:var(--w2s)}body[data-week="3"]{--acc:var(--w3);--accs:var(--w3s)}body[data-week="4"]{--acc:var(--w4);--accs:var(--w4s)}body[data-week="5"]{--acc:var(--w5);--accs:var(--w5s)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 var(--body);overflow-x:clip;padding:0 16px 48px}
.wrap{max-width:1040px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;background:none;border:0;padding:0;text-align:left}
.brand svg{width:46px;height:46px;flex:none}
.brand small{display:block;font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{font:700 26px var(--display)}
.btn{border:0;border-radius:16px;padding:12px 22px;font:600 19px var(--display);background:var(--acc);color:var(--paper);min-height:48px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
/* home list */
.intro{background:var(--accs);border-radius:28px;padding:26px clamp(20px,4vw,40px);margin:6px 0 22px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.intro .big{font-size:clamp(56px,9vw,90px);line-height:1}
.intro h1{font-size:clamp(30px,5vw,46px);line-height:1.05}
.intro p{margin:6px 0 0;font-size:18px}
.series{margin:22px 0 10px;font:600 15px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.list{display:grid;gap:12px}
.item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:14px 18px}
.item.ready{cursor:pointer}.item.ready:hover{border-color:var(--leaf)}
.item .em{font-size:48px;text-align:center}
.item h3{font-size:23px}
.item .ref{font:600 14px var(--display);color:var(--muted);letter-spacing:.04em}
.item p{margin:2px 0 0;font-size:17px}
.item .side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.pill{font:600 13px var(--display);padding:4px 12px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.go{background:var(--leaf);color:var(--paper)}
.done{display:flex;align-items:center;gap:8px;font:600 15px var(--display);color:var(--muted);background:none;border:2px solid var(--line);border-radius:12px;padding:6px 12px;min-height:40px;white-space:nowrap}
.done[aria-pressed=true]{border-color:var(--good);color:var(--good);background:var(--goodbg)}
.note{color:var(--muted);font-size:14px;margin-top:14px}
.hfind{display:grid;gap:10px;margin:0 0 8px}#hsearch{font:inherit;font-size:18px;padding:12px 16px;border:2px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);width:100%}.hjump{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.hchip{flex:none;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font:600 15px var(--display);min-height:40px}.hchip:hover{border-color:var(--leaf)}
.hgroup{margin-top:14px;scroll-margin-top:12px}.hgroup>summary{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 4px;list-style:none}.hgroup>summary::-webkit-details-marker{display:none}.hgroup>summary::before{content:"▸";color:var(--muted);font-size:18px;transition:transform .15s}.hgroup[open]>summary::before{transform:rotate(90deg)}.hgroup>summary .series{margin:0 auto 0 0}.hcount{font-size:14px;color:var(--muted)}
/* lesson */
.hero{background:var(--accs);border-radius:28px;padding:24px clamp(20px,4vw,40px);display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin:6px 0 16px}
.hero .big{font-size:clamp(56px,9vw,96px);line-height:1}
.hero .ref{font:600 15px var(--display);color:var(--acc);letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.05;margin:4px 0 8px}
.hero p{margin:0;font-size:20px}
.printables{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.dl{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--acc);background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 14px;font:600 16px var(--display);text-decoration:none}
.dl small{font:700 12px var(--body);color:var(--acc)}
.dlmsg{font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.tab{flex:none;border:0;background:transparent;padding:10px 16px;border-radius:14px;font:600 18px var(--display);color:var(--muted);min-height:48px}
.tab[aria-selected=true]{background:var(--paper);color:var(--ink);box-shadow:0 0 0 2px var(--acc) inset}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:28px;padding:clamp(18px,4vw,40px);min-height:460px}
.panel h2{font-size:clamp(28px,4vw,38px);margin-bottom:6px}
.lead{color:var(--muted);margin:0 0 20px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.dots{display:flex;gap:8px}.dot{width:14px;height:14px;border-radius:50%;background:var(--line);border:0;padding:0}.dot[aria-current=true]{background:var(--acc);transform:scale(1.3)}
/* story */
.stage{background:var(--accs);border-radius:32px;padding:clamp(16px,3vw,28px);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(6px,1.5vw,16px);min-height:220px}
.stage button,.stage span{font-size:clamp(54px,9vw,96px);line-height:1;background:none;border:0;padding:6px;border-radius:20px}
.stage button.found{background:var(--sun);animation:pop .5s}
.stage button.nope{animation:wig .35s}
.say{font:500 clamp(24px,3.4vw,36px)/1.3 var(--display);margin:20px 0 10px;text-align:center}
.act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chip{border-radius:999px;padding:8px 16px;font:600 17px var(--display);background:var(--soft)}
.chip.do{background:var(--acc);color:var(--paper)}
.status{font:600 21px var(--display);min-height:1.6em;margin-top:12px;text-align:center;color:var(--good)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.2)}100%{transform:none}}
@keyframes wig{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.watch .stage span{animation:bob 2.4s ease-in-out infinite}
.watch .stage span:nth-child(2n){animation-delay:.4s}.watch .stage span:nth-child(3n){animation-delay:.8s}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:16px}.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.vids{display:grid;gap:12px}.vid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px;border:2px solid var(--line);border-radius:20px;text-decoration:none;color:var(--ink);font:600 20px var(--display)}.vid:hover{border-color:var(--acc)}.vid .play{width:48px;height:48px;border-radius:50%;background:#FF0000;color:#fff;display:grid;place-items:center;font-size:20px}.vid .go{font-size:15px;color:var(--acc)}
@media(max-width:600px){.vid{grid-template-columns:auto minmax(0,1fr)}.vid .go{grid-column:2}}
/* verse */
.verse{font:600 clamp(30px,5vw,52px)/1.25 var(--display);text-align:center;margin:10px 0}
.vref{text-align:center;color:var(--acc);font:600 20px var(--display)}
.motions{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:24px}
.motion{background:var(--accs);border-radius:20px;padding:16px;text-align:center}
.motion b{display:block;font:700 26px var(--display)}
.motion.on{outline:4px solid var(--acc)}
.modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
/* song */
.song p{font:500 clamp(22px,3vw,30px)/1.4 var(--display);margin:0 0 18px}
.tune{font:600 16px var(--display);color:var(--acc);letter-spacing:.05em;text-transform:uppercase}
/* play */
.games4{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.q{font:600 clamp(26px,3.6vw,36px)/1.25 var(--display);text-align:center;margin:6px 0 20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pick{border:3px solid var(--line);background:var(--paper);border-radius:28px;padding:22px 10px;display:grid;gap:8px;justify-items:center}
.pick .e{font-size:clamp(64px,11vw,110px);line-height:1}
.pick .l{font:600 22px var(--display)}
.pick.right{border-color:var(--good);background:var(--goodbg)}
.pick.wrong{animation:wig .35s}
.counter{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.counter button{font-size:clamp(52px,8vw,80px);line-height:1;background:var(--soft);border:0;border-radius:22px;padding:12px;position:relative}
.counter button.on{background:var(--sun)}
.counter button .n{position:absolute;top:4px;right:8px;font:700 20px var(--display);color:#2B2340}
.bignum{font:700 72px var(--display);color:var(--acc);text-align:center;line-height:1;margin-top:16px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:560px;margin:0 auto}
.card{aspect-ratio:1;border:0;border-radius:22px;background:var(--acc);color:var(--paper);font-size:clamp(46px,9vw,80px);display:grid;place-items:center}
.card.up,.card.got{background:var(--accs)}
.card.got{outline:4px solid var(--good)}
/* move & pray, teacher */
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.game{background:var(--accs);border-radius:22px;padding:18px}.game h3{font-size:21px;margin-bottom:6px}.game p{margin:0;font-size:17px}
.sub{font-size:24px;margin:28px 0 10px}
.prayer{background:var(--soft);border-radius:22px;padding:22px;display:grid;gap:6px}
.prayer span{font:500 26px var(--display)}
.links{padding-left:1.2em;margin:0;display:grid;gap:6px}.links a{color:var(--acc);font-weight:700}
.plan{width:100%;border-collapse:collapse;font-size:18px}.plan td{padding:10px 8px;border-bottom:1px solid var(--line)}.plan td:first-child{font:700 18px var(--display);color:var(--acc);white-space:nowrap;width:5.5em}
.tips{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.tips div{background:var(--accs);border-radius:20px;padding:18px}.tips ul{margin:6px 0 0;padding-left:1.1em}
@media(max-width:700px){body{font-size:16px}.intro,.hero{grid-template-columns:1fr;gap:8px}.item{grid-template-columns:52px minmax(0,1fr)}.item .em{font-size:38px}.item .side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}.games,.tips{grid-template-columns:1fr}.two{gap:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tbox{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:14px}.tbtn{display:inline-flex;align-items:center;min-height:44px;padding:8px 18px;border-radius:999px;background:#15803d;color:#fff;font:600 16px var(--display,inherit);text-decoration:none}button.tbtn{border:0;cursor:pointer;font-family:inherit}.tbtn:disabled{opacity:.7}.tbtn:hover{filter:brightness(1.08)}.tbtn.done{background:#166534}.tnote{font-size:14px;color:var(--muted)}.tbadge{display:inline-block;font:600 13px var(--display,inherit);padding:4px 12px;border-radius:999px;background:#dcfce7;color:#166534;white-space:nowrap}:root[data-theme=dark] .tbadge{background:#14532d;color:#bbf7d0}
.folahbar{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px;background:linear-gradient(135deg,#6a2079,#4a0e5e);color:#fff;text-decoration:none;font:600 15px/1.2 var(--display,system-ui),system-ui,sans-serif;letter-spacing:.02em;border-radius:0 0 18px 18px}.folahbar img{height:34px;width:auto;display:block}.folahbar span{border-left:1px solid rgba(255,255,255,.45);padding-left:12px}.folahbar:hover span{text-decoration:underline}@media(max-width:420px){.folahbar img{height:26px}.folahbar{font-size:14px}}
.tdone{display:inline-flex;align-items:center;min-height:44px;padding:8px 18px;border-radius:999px;background:#dcfce7;color:#166534;font:600 16px var(--display,inherit)}.tundo{min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--line,#ddd);background:transparent;color:inherit;font:600 15px var(--display,inherit);cursor:pointer}.tundo:hover{border-color:#b91c1c;color:#b91c1c}</style></head><body>

<div class="wrap">
 <header class="top">

   <svg viewBox="0 0 46 46" aria-hidden="true"><path d="M23 42V22" stroke="var(--leaf)" stroke-width="4" stroke-linecap="round"/><path d="M23 24C23 14 15 8 6 9c0 10 7 16 17 15z" fill="var(--leaf)"/><path d="M23 20C23 11 30 5 40 6c0 9-7 15-17 14z" fill="var(--leaf)" opacity=".75"/><circle cx="23" cy="42" r="3" fill="var(--sun)"/></svg>

 </header>
 <main id="app"></main>

<script>
const TFORM="https://docs.google.com/forms/d/e/1FAIpQLSfIBJ1sXmvImWeF5XjNUVK7eR9x6xhMcaYXlVSv8DHYiyRwIQ/formResponse";const TCLS="Buds";

function tKey(s,w){return s.id+"-w"+w.id}
function tEsc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function tFmt(d){const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(d||"");return m?["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m[2]-1]+" "+(+m[3]):""}
function tToday(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function tLocal(){try{return JSON.parse(localStorage.getItem("folah-taught-local")||"{}")}catch(e){return {}}}
function tSetLocal(k,act){const L=tLocal();L[k]={act:act,t:Date.now(),d:tToday()};try{localStorage.setItem("folah-taught-local",JSON.stringify(L))}catch(_){}}
function tStateK(k){const L=tLocal()[k];if(L&&Date.now()-L.t<15*60*1000)return L.act==="done"?L.d:"";const t=((window.TAUGHT||{})[TCLS]||{})[k];return typeof t==="string"?t:""}
function tOn(s,w){return tStateK(tKey(s,w))}

function tInner(d,note){return (d?`<span class="tdone">✓ Done</span><button type="button" class="tundo">Undo</button>`:`<button type="button" class="tbtn">✓ Mark as done</button>`)+`<span class="tnote" aria-live="polite">${tEsc(note!=null?note:(d?"Marked done "+tFmt(d):""))}</span>`}
function tButton(s,w){const k=tKey(s,w);return `<div class="tbox" data-tkey="${k}" data-tlabel="${tEsc(s.name+" · Week "+w.id+" · "+w.title+" ["+k+"]")}">${tInner(tStateK(k))}</div>`}
document.addEventListener("click",e=>{const btn=e.target.closest&&e.target.closest(".tbox button");if(!btn||btn.disabled)return;const box=btn.closest(".tbox"),k=box.dataset.tkey,act=btn.classList.contains("tundo")?"undo":"done";btn.disabled=true;btn.textContent="Saving…";const body=new URLSearchParams({"entry.2009767917":TCLS,"entry.749423249":(act==="undo"?"UNDO · ":"")+box.dataset.tlabel});fetch(TFORM,{method:"POST",mode:"no-cors",body}).then(()=>{tSetLocal(k,act);box.innerHTML=tInner(act==="done"?tToday():"",act==="done"?"Saved. All teachers will see this lesson as Done.":"Undone. This lesson is no longer marked Done.")}).catch(()=>{box.innerHTML=tInner(tStateK(k),"Couldn't save. Check the internet connection and try again.")})});
function tParse(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==","){r.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);rows.push(r);r=[];f=""}else f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows}
function tLoad(){fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vR4cYcZnDHHFgFZsrfBzCw0LdCCtG51aVl-gYTNF9tX9miDG6sBqKb4Lz6bOZmZSGHueATgKdGoFVO4/pub?output=csv&t="+Date.now()).then(r=>r.ok?r.text():Promise.reject()).then(t=>{const T={};tParse(t).slice(1).forEach(([ts,cls,les])=>{const m=/\[([a-z0-9-]+)\]\s*$/.exec(les||""),d=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(ts||"");if(!m||!d||!cls)return;const C=(T[cls]=T[cls]||{});if(/^\s*UNDO\b/.test(les))delete C[m[1]];else C[m[1]]=d[3]+"-"+d[1].padStart(2,"0")+"-"+d[2].padStart(2,"0")});window.TAUGHT=T;try{window.tRefresh&&window.tRefresh()}catch(_){}}).catch(()=>{})}

  return `<div class="q">${esc(it.q)}</div><div class="two">${opt.map((o,i)=>`<button class="pick ${p!==null&&i===it.right?"right":""}" data-act="wpick" data-i="${i}"><span class="e">${esc(o[0])}</span><span class="l">${esc(o[1])}</span></button>`).join("")}</div>
  <div class="status">${p===it.right?"⭐ Yes! That's right!":""}</div>${p===it.right?`<div style="text-align:center"><button class="btn" data-act="wnext">Next →</button></div>`:""}`},
 thumbs(w,s){if(s.thumb>=w.thumbs.length)return `<div class="q">🎉 You know the story!</div><div style="text-align:center"><button class="btn ghost" data-act="treset">Play again</button></div>`;
  const [t,v]=w.thumbs[s.thumb],p=s.tpick;
  return `<div class="q">${esc(t)}</div><div class="two"><button class="pick ${p!==null&&v?"right":""}" data-act="tpick" data-v="1"><span class="e">👍</span><span class="l">Yes!</span></button><button class="pick ${p!==null&&!v?"right":""}" data-act="tpick" data-v="0"><span class="e">👎</span><span class="l">No!</span></button></div>
  <div class="status">${p===v?(v?"⭐ Yes, that's true!":"⭐ Right, that didn't happen!"):""}</div>${p===v?`<div style="text-align:center"><button class="btn" data-act="tnext">Next →</button></div>`:""}`},
 count(w,s){return w.count.map(([e,n,l],ci)=>{const c=s.count[ci]||0;return `<div class="q">Count the ${esc(l)}!</div><div class="counter">${Array.from({length:n},(_,i)=>`<button class="${i<c?"on":""}" data-act="cnt" data-c="${ci}" data-i="${i}" aria-label="${esc(e)} ${i+1}">${esc(e)}${i<c?`<span class="n">${i+1}</span>`:""}</button>`).join("")}</div><div class="bignum">${c===n?`${n}! 🎉`:c||""}</div>`}).join(`<hr style="border:0;border-top:2px dashed var(--line);margin:24px 0">`)+`<div style="text-align:center;margin-top:16px"><button class="btn ghost" data-act="creset">Count again</button></div>`},
 match(w,s){if(!s.order){const a=[...w.match,...w.match];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}s.order=a}
  const all=s.got.length===s.order.length;
  return `<div class="q">${all?"🎉 You matched them all!":"Find the pairs!"}</div><div class="cards">${s.order.map((e,i)=>{const up=s.flip.includes(i)||s.got.includes(i);return `<button class="card ${up?"up":""} ${s.got.includes(i)?"got":""}" data-act="flip" data-i="${i}" aria-label="${up?esc(e):"Card "+(i+1)}">${up?esc(e):"🌱"}</button>`}).join("")}</div>${all?`<div style="text-align:center;margin-top:16px"><button class="btn ghost" data-act="mreset">Play again</button></div>`:""}`}
};

$("#app").addEventListener("click",e=>{
 if(!view)return;const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;render();return}
 const dl=e.target.closest("[data-dl]");if(dl){if(!downloadsApi)return;e.preventDefault();getFile(+dl.dataset.dl);return}
 const b=e.target.closest("[data-act]");if(!b)return;const w=find(view).w,s=S(),a=b.dataset.act,i=+b.dataset.i;
 switch(a){
  case "nexttab":{const n=nextTab();if(n){tab=n[0];render();window.scrollTo({top:0,behavior:"smooth"})}return}
  case "next":s.scene++;break;case "prev":s.scene--;break;case "go":s.scene=i;break;
    case "find":{const f=w.story[s.scene].find;if(f&&f[0]===i){s.found[s.scene]=1}else{b.classList.remove("nope");void b.offsetWidth;b.classList.add("nope");return}break}
    case "vnext":s.vstep=(s.vstep+1)%w.verse.motions.length;break;
    case "vloud":$("#st").textContent="📢 Everybody, say it LOUD!";return;
  case "vsoft":$("#st").textContent="🤫 Shh... now whisper it.";return;
  case "game":s.game=b.dataset.g;break;
  case "wpick":{const it=w.which[s.which];if(i===it.right){s.wpick=i}else{b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");return}break}
  case "wnext":s.which++;s.wpick=null;break;case "wreset":s.which=0;s.wpick=null;break;
  case "tpick":{const v=b.dataset.v==="1";if(v===w.thumbs[s.thumb][1]){s.tpick=v}else{b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");return}break}
  case "tnext":s.thumb++;s.tpick=null;break;case "treset":s.thumb=0;s.tpick=null;break;
  case "cnt":{const c=+b.dataset.c,cur=s.count[c]||0;if(i===cur){s.count[c]=cur+1}break}
  case "creset":s.count={};break;
  case "flip":{if(s.got.includes(i)||s.flip.includes(i))return;if(s.flip.length===2)s.flip=[];s.flip.push(i);if(s.flip.length===2){const[x,y]=s.flip;if(s.order[x]===s.order[y]){s.got.push(x,y);s.flip=[]}else setTimeout(()=>{if(S().flip.length===2){S().flip=[];panel()}},900)}break}
  case "mreset":s.order=null;s.flip=[];s.got=[];break;
 }
 panel();
});
document.addEventListener("keydown",e=>{if(!view||tab!=="story")return;const w=find(view).w,s=S();if(e.key==="ArrowRight"&&s.scene<w.story.length-1){s.scene++;panel()}if(e.key==="ArrowLeft"&&s.scene>0){s.scene--;panel()}});

/* printables */
let downloadsApi=null;
(async()=>{try{downloadsApi=await window.claude?.use?.("downloads")}catch(e){downloadsApi=null}})();
async function getFile(i){const [,,path,filename]=find(view).w.files[i],m=$("#dlmsg");try{m.textContent="Getting the file ready...";const r=await fetch(path);if(!r.ok)throw 0;await downloadsApi.save({filename,data:await r.blob()});m.textContent="Saved to your downloads."}catch(err){m.textContent=err&&err.code==="declined"?"":"Could not save the file here. Try opening it on a computer."}}

const h=(location.hash||"").slice(1);if(h&&find(h)&&find(h).w.ready){view=h;render()}else home();
window.addEventListener("hashchange",()=>{const k=(location.hash||"").slice(1);if(k&&k!==view&&find(k)&&find(k).w.ready){view=k;tab="story";render()}});
}
